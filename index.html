        if(until < from){ showToast('Tarikh akhir mesti selepas tarikh mula.', 'error'); return; }
        if(!confirm(`Sahkan cuti kedai dari ${from} hingga ${until}?`)) return;
        saveHolidayBtn.disabled=true;
        const holidays=(state.shopHolidays||[]).slice();
        const index=holidays.findIndex(h=>h.id===state.holidayEditId);
        const entry={id:index>=0?holidays[index].id:'h_'+Date.now(),from,until};
        if(index>=0) holidays[index]=entry; else holidays.push(entry);
        const saving=saveHolidayList(holidays);
        state.holidayEditId=null; state.holidayFormFrom=''; state.holidayFormUntil=''; render();
        if(await saving) showToast(`Cuti disimpan: ${from} hingga ${until}.`, 'success');
        else showToast('Senarai dikemas kini, tetapi gagal simpan ke server. Cuba lagi.', 'error');
      };
      document.querySelectorAll('.holiday-edit').forEach(btn=>{
        btn.onclick=()=>{ const h=(state.shopHolidays||[]).find(x=>x.id===btn.dataset.id); if(!h)return; state.holidayEditId=h.id; state.holidayFormFrom=h.from; state.holidayFormUntil=h.until; render(); setTimeout(()=>document.getElementById('holidayForm')?.scrollIntoView({behavior:'smooth',block:'start'}),50); };
      });
      document.querySelectorAll('.holiday-delete').forEach(btn=>{
        btn.onclick=async()=>{ const h=(state.shopHolidays||[]).find(x=>x.id===btn.dataset.id); if(!h)return; if(!confirm(`Padam cuti ${h.from} hingga ${h.until}?`))return; const holidays=state.shopHolidays.filter(x=>x.id!==h.id); if(await saveHolidayList(holidays)){ state.holidayEditId=null; showToast('Cuti dipadam. Kedai dibuka seperti biasa jika tiada cuti aktif.','success'); render(); } };
      });
      const addBtn = document.getElementById('addAdmin');
      if(addBtn){
        addBtn.onclick = async () => {
          const name = (document.getElementById('newAdminName').value || '').trim();
          const username = (document.getElementById('newAdminUsername').value || '').trim();
          const password = (document.getElementById('newAdminPassword').value || '').trim();
          if(!name || !username || !password){
            state.adminMgmtError = 'Sila isi semua maklumat.';
            render();
            return;
          }
          if(!isValidAdminPassword(password)){
            state.adminMgmtError = 'Kata laluan mesti sekurang-kurangnya 3 aksara, ada 1 huruf dan 1 simbol (!@#$% dll).';
            render();
            return;
          }
          const admins = await loadAdmins();
          if(admins.some(a => a.username === username)){
            state.adminMgmtError = 'ID admin sudah digunakan.';
            render();
            return;
          }
          admins.push({ id:'a_'+Date.now(), name, username, password });
          await addAdminApi(name, username, password);
          state.adminAccounts = await loadAdmins();
          state.adminMgmtError = '';
          render();
        };
      }

      document.querySelectorAll('.a-edit').forEach(btn=>{
        btn.onclick = () => {
          state.adminEditId = btn.dataset.id;
          state.adminMgmtError = '';
          render();
        };
      });

      document.querySelectorAll('.a-delete').forEach(btn=>{
        btn.onclick = async () => {
          const id = btn.dataset.id;
          await deleteAdminApi(id);
          state.adminAccounts = await loadAdmins();
          render();
        };
      });

      const saveBtn = document.getElementById('saveEdit');
      if(saveBtn){
        saveBtn.onclick = async () => {
          const id = saveBtn.dataset.id;
          const name = (document.getElementById('editName').value || '').trim();
          const username = (document.getElementById('editUsername').value || '').trim();
          const password = (document.getElementById('editPassword').value || '').trim();
          if(!name || !username || !password){
            state.adminMgmtError = 'Sila isi semua maklumat.';
            render();
            return;
          }
          if(!isValidAdminPassword(password)){
            state.adminMgmtError = 'Kata laluan mesti sekurang-kurangnya 3 aksara, ada 1 huruf dan 1 simbol (!@#$% dll).';
            render();
            return;
          }
          const admins = await loadAdmins();
          if(admins.some(a => a.username === username && a.id !== id)){
            state.adminMgmtError = 'ID admin sudah digunakan.';
            render();
            return;
          }
          const idx = admins.findIndex(a => a.id === id);
          if(idx >= 0) admins[idx] = { id, name, username, password };
          await updateAdminApi(id, name, username, password);
          state.adminAccounts = await loadAdmins();
          state.adminEditId = null;
          state.adminMgmtError = '';
          render();
        };
      }

      const cancelBtn = document.getElementById('cancelEdit');
      if(cancelBtn){
        cancelBtn.onclick = () => {
          state.adminEditId = null;
          state.adminMgmtError = '';
          render();
        };
      }
    }

    startAdminClock();
  } else {
    if(clockTimer){ clearInterval(clockTimer); clockTimer = null; }
  }
}

function startAdminClock(){
  if(clockTimer) clearInterval(clockTimer);
  const update = () => {
    const el = document.getElementById('adminClock');
    if(!el){ clearInterval(clockTimer); clockTimer = null; return; }
    el.textContent = new Date().toLocaleTimeString('ms-MY');
  };
  update();
  clockTimer = setInterval(update, 1000);
}

async function submitOrder(){
  const items = MENU.filter(m => (state.cart[m.id]||0) > 0)
    .map(m => {
      const temp = m.temp === 'both' ? (state.itemTemp[m.id] || 'hot') : null;
      const name = temp ? m.name + ' (' + (temp === 'hot' ? 'Hot' : 'Ice') + ')' : m.name;
      return { name, qty: state.cart[m.id], price: m.price };
    });
  if(items.length === 0) return;

  const ctx = getAudioCtx();
  if(ctx && ctx.state === 'suspended') ctx.resume();
  if(typeof Notification !== 'undefined' && Notification.permission === 'default'){
    try{ Notification.requestPermission(); }catch(e){}
  }

  state.submitting = true;
  render();

  const total = items.reduce((s,i)=>s + i.price*i.qty, 0);
  const order = {
    id: 'o_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    items,
    total,
    status: 'pending',
    createdAt: Date.now(),
    customerName: state.customer ? state.customer.name : '',
    customerPhone: state.customer ? state.customer.phone : ''
  };

  const queueNo = await addOrder(order);
  order.queueNo = queueNo;
  await recordCustomerPurchase(order);
  state.myLoyalty = undefined;

  state.myOrderIds.push(order.id);
  state.myOrders.push(order);
  state.activeQueueId = order.id;
  state.cart = {};
  state.itemTemp = {};
  state.view = 'waiting';
  state.submitting = false;
  render();
}

/* ---------- sound effects ---------- */
let lastUiBeepAt = 0;
document.addEventListener('pointerdown', (event) => {
  const button = event.target.closest('button');
  const now = performance.now();
  if(button && now - lastUiBeepAt > 180){ lastUiBeepAt = now; beep(520, 0.045, 0); }
}, {passive:true});
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return audioCtx;
}
function beep(freq, duration, delay){
  const ctx = getAudioCtx();
  if(!ctx) return;
  if(ctx.state === 'suspended'){ ctx.resume().catch(()=>{}); }
  const t0 = ctx.currentTime + (delay||0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}
function playNewOrderSound(){
  beep(880, 0.15, 0);
  beep(1100, 0.15, 0.16);
  beep(880, 0.15, 0.5);
  beep(1100, 0.15, 0.66);
}
function playReadySound(){
  beep(660, 0.15, 0);
  beep(880, 0.15, 0.18);
  beep(1100, 0.22, 0.36);
  beep(660, 0.15, 0.7);
  beep(880, 0.15, 0.88);
  beep(1100, 0.22, 1.06);
}
function showReadyNotification(order){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission !== 'granted') return;
  try{
    const n = new Notification("K'fe De Sol", {
      body: `Pesanan anda (No. ${String(order.queueNo).padStart(3,'0')}) sudah siap! Sila buat bayaran di kaunter.`,
      icon: LOGO_URL,
      tag: 'kfe-order-' + order.id
    });
    n.onclick = () => {
      window.focus();
      n.close();
    };
  }catch(e){}
}
function notifyOrderReady(order){
  playReadySound();
  showReadyNotification(order);
  if(navigator.vibrate) navigator.vibrate([250,100,250,100,500]);
}

/* ---------- shared: refresh status of all tracked orders ---------- */
const CUSTOMER_AUTO_JUMP_VIEWS = ['menu', 'preview', 'promo', 'waiting'];

/* Re-fetch all orders and update state.myOrders for this customer's
   tracked queue numbers. If any order just became "siap", fire the
   ready notification and (if the customer is on a normal browsing
   view, not a modal) switch to the "No. Giliran" page for that order.
   If any order just became "selesai" (admin confirmed customer has
   collected the drink), a receipt snapshot is saved into
   state.myReceipts (so the customer can review it later this session),
   then it is dropped entirely from myOrderIds/myOrders - that queue
   number is done and should stop showing/blinking. If the customer
   was actively viewing a now-removed order, they're bounced back to
   the menu. Returns { changed, newlyReady }. */
async function refreshMyOrders(){
  if(!state.myOrderIds || state.myOrderIds.length === 0) return { changed:false, newlyReady:null };

  const orders = await loadOrders();
  const myOrdersAll = orders.filter(o => state.myOrderIds.includes(o.id));

  const prevMap = {};
  (state.myOrders||[]).forEach(o => { prevMap[o.id] = orderStatus(o); });

  let newlyReady = null;
  let newlyRejected = null;
  myOrdersAll.forEach(o => {
    const prevStatus = prevMap[o.id];
    if(orderStatus(o) === 'siap' && prevStatus !== 'siap' && prevStatus !== 'selesai' && prevStatus !== undefined){
      newlyReady = o;
    }
    if(orderStatus(o) === 'rejected' && prevStatus !== orderStatus(o) && prevStatus !== undefined){
      newlyRejected = o;
    }
  });

  // Orders that are 'selesai' are fully done - save a receipt snapshot
  // (if not already saved) and drop them from tracking so the queue
  // button/page stops showing them.
  const myOrders = myOrdersAll.filter(o => orderStatus(o) !== 'selesai');
  const justDone = myOrdersAll.filter(o => orderStatus(o) === 'selesai');
  const removedIds = justDone.map(o => o.id);

  if(justDone.length > 0){
    if(!state.myReceipts) state.myReceipts = [];
    const existingIds = new Set(state.myReceipts.map(r => r.id));
    justDone.forEach(o => {
      if(!existingIds.has(o.id)) state.myReceipts.unshift(o);
    });
    state.completedOrder = justDone[0];
    if(completedReturnTimer) clearTimeout(completedReturnTimer);
    const completedId = state.completedOrder.id;
    completedReturnTimer = setTimeout(() => {
      if(state.completedOrder && state.completedOrder.id === completedId){
        state.completedOrder = null;
        if(state.view === 'waiting'){
          const nextOrder = (state.myOrders || [])[0];
          if(nextOrder){ state.activeQueueId = nextOrder.id; state.view = 'waiting'; }
          else state.view = 'menu';
        }
        completedReturnTimer = null;
        render();
      }
    }, 8000);
  }

  if(removedIds.length > 0){
    state.myOrderIds = state.myOrderIds.filter(id => !removedIds.includes(id));
    if(removedIds.includes(state.activeQueueId)){
      const nextOrder = myOrders[0];
      state.activeQueueId = nextOrder ? nextOrder.id : null;
    }
  }

  const changed = JSON.stringify(myOrders) !== JSON.stringify(state.myOrders) || removedIds.length > 0;
  state.myOrders = myOrders;

  if(newlyReady){
    notifyOrderReady(newlyReady);
    if(CUSTOMER_AUTO_JUMP_VIEWS.includes(state.view) && !state.lightboxImage){
      state.activeQueueId = newlyReady.id;
      state.view = 'waiting';
    }
  }
  if(newlyRejected){
    notifyOrderRejected(newlyRejected);
    if(CUSTOMER_AUTO_JUMP_VIEWS.includes(state.view) && !state.lightboxImage){
      state.activeQueueId = newlyRejected.id;
      state.view = 'waiting';
    }
  }

  return { changed, newlyReady, newlyRejected };
}

/* ---------- polling ---------- */
function setupPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    checkMidnightReset(); // check auto reset on 1st of month
    if(state.view === 'admin'){
      const sessionValid = await adminSessionIsValid();
      if(sessionValid === true) adminInvalidSessionChecks = 0;
      if(sessionValid === false) adminInvalidSessionChecks += 1;
      if(adminInvalidSessionChecks >= 2){ forceAdminLogout('Akaun ini telah log masuk pada peranti lain. Sesi anda telah ditamatkan.'); adminInvalidSessionChecks=0; return; }
      const orders = await loadOrders();
      const changed = JSON.stringify(orders) !== JSON.stringify(state.allOrders);
      if(changed){
        const oldIds = new Set((state.allOrders||[]).map(o=>o.id));
        const hasNewOrder = orders.some(o => !oldIds.has(o.id));
        if(hasNewOrder && state.allOrders) playNewOrderSound();
      }
      state.allOrders = orders;
      const today = new Date().toDateString();
      const dateChanged = state.lastDashboardDate !== undefined && state.lastDashboardDate !== today;
      state.lastDashboardDate = today;
      if((changed || dateChanged) && (state.adminTab || 'pesanan') !== 'menu') render();
    } else {
      const { changed, newlyReady, newlyRejected } = await refreshMyOrders();
      if(changed || newlyReady || newlyRejected) render();
    }
  }, 3000);

  // Also poll menu meta, but slower to avoid repeated network permission popups in Preview
  if(menuMetaTimer) clearInterval(menuMetaTimer);
  menuMetaTimer = setInterval(async () => {
    await loadMenuMeta();
  }, 10000);

  // Listen for localStorage changes from OTHER tabs (admin tab saves -> customer tab updates)
  window.addEventListener('storage', (e) => {
    if(e.key === 'kfedeSolOrderStatusSync'){
      try{
        const change = JSON.parse(e.newValue || '{}');
        let changed = false;
        (state.myOrders || []).forEach(order => {
          if(String(order.id) === String(change.id) && order.status !== change.status){
            order.status = change.status;
            changed = true;
          }
        });
        if(changed && state.view === 'waiting') render();
      }catch(err){}
      return;
    }
    if(e.key === 'kfedeSolMenuPublished'){
      try{
        const publishedMap = JSON.parse(e.newValue || '{}');
        let changed = false;
        Object.keys(publishedMap).forEach(id => {
          const published = publishedMap[id] !== false;
          if(menuPublished[id] !== published){
            menuPublished[id] = published;
            if(!published && state.cart[id]) state.cart[id] = 0;
            changed = true;
          }
        });
        if(changed && (state.view === 'menu' || state.view === 'preview')) render();
      }catch(err){}
      return;
    }
    if(e.key !== 'kfedeSolMenuOverrides') return;
    try{
      const overrides = JSON.parse(e.newValue || '{}');
      let changed = false;
      Object.keys(overrides).forEach(id => {
        const ov = overrides[id];
        if(ov.name && menuNames[id] !== ov.name){ menuNames[id] = ov.name; changed = true; }
        if(ov.price != null && menuPrices[id] !== ov.price){ menuPrices[id] = ov.price; changed = true; }
        const mi = MENU.find(m => m.id === id);
        if(mi){
          if(ov.name) mi.name = ov.name;
          if(ov.price != null) mi.price = ov.price;
        }
      });
      if(changed && (state.view === 'menu' || state.view === 'preview')) render();
    }catch(err){}
  });
}

/* ---------- catch-up check when returning to the app ---------- */
let visibilityListenerAttached = false;
let menuMetaTimer = null;
function setupVisibilityCatchup(){
  if(visibilityListenerAttached) return;
  visibilityListenerAttached = true;
  document.addEventListener('visibilitychange', async () => {
    if(document.visibilityState !== 'visible') return;
    if(state.view === 'admin') return;
    const { changed, newlyReady, newlyRejected } = await refreshMyOrders();
    if(changed || newlyReady || newlyRejected) render();
  });
}


/* ---------- Toast notification helper ---------- */
function showToast(msg, type){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const toast = document.createElement('div');
  toast.className = 'toast' + (type ? ' ' + type : '');
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { if(toast.parentNode) toast.parentNode.removeChild(toast); }, 2600);
}


/* ---------- Midnight auto-reset on 1st of month ---------- */
let lastAutoResetCheck = null;
async function checkMidnightReset(){
  const now = new Date();
  const key = now.getFullYear() + '-' + (now.getMonth()+1) + '-' + now.getDate();
  if(lastAutoResetCheck === key) return; // already checked today
  lastAutoResetCheck = key;

  // Only reset on 1st of month, between 00:00 and 00:05
  const isFirstOfMonth = now.getDate() === 1;
  const isJustAfterMidnight = now.getHours() === 0 && now.getMinutes() <= 5;
  if(isFirstOfMonth && isJustAfterMidnight){
    // Archive customers first (keeps monthly data)
    await archiveCustomersIfNeeded();
    // Reset active orders only
    await resetAllOrders();
    if(state.view === 'admin'){
      state.allOrders = [];
      showToast('🌙 Auto-reset: Pesanan bulan lama telah dikosongkan. Data laporan disimpan.', 'success');
      render();
    }
  }
}
