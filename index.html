/* ---------- waiting ---------- */
function renderWaiting(){
  const myOrders = (state.myOrders || []).filter(o => (state.myOrderIds||[]).includes(o.id));
  const completedOnly = myOrders.length === 0 && state.completedOrder;
  if(myOrders.length === 0 && !completedOnly) return `<div class="waiting"><p>Tiada pesanan aktif.</p></div>`;

  let activeId = state.activeQueueId;
  if(!completedOnly && (!activeId || !myOrders.some(o => o.id === activeId))){
    activeId = myOrders[myOrders.length - 1].id;
    state.activeQueueId = activeId;
  }
  const order = completedOnly ? state.completedOrder : myOrders.find(o => o.id === activeId);

  const tabsHtml = myOrders.length > 1 ? `
    <div class="queue-tabs">
      ${myOrders.map(o => {
        const oReady = orderStatus(o) === 'siap';
        const oRejected = isOrderRejected(o);
        return `<button class="queue-tab ${o.id===activeId?'active':''} ${oReady?'ready':''}" data-id="${o.id}">No. ${String(o.queueNo).padStart(3,'0')}${oReady ? ' &#10003;' : (oRejected ? ' &#10005;' : '')}</button>`;
      }).join('')}
    </div>
  ` : '';

  const ready = orderStatus(order) === 'siap';
  const making = orderStatus(order) === 'sedang_dibuat';
  const collected = orderStatus(order) === 'selesai';
  const rejected = isOrderRejected(order);
  const rejectReason = getRejectReason(order);
  const itemsHtml = order.items.map(i => `<div class="row"><span>${i.name} x${i.qty}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('');
  const progressIndex = collected ? 3 : (ready ? 2 : (making ? 1 : 0));
  const roadmapLabels = ['Pesanan diterima','Sedang dibuat','Siap diambil','Sudah diambil'];
  const roadmapHtml = rejected ? '' : `<div class="order-roadmap" aria-label="Status pesanan">${roadmapLabels.map((label,index) => {
    const stepClass = index < progressIndex ? 'done' : (index === progressIndex ? (collected ? 'done collected' : 'active') : '');
    return `<div class="road-step ${stepClass}"><div class="road-dot">${index < progressIndex || collected ? '&#10003;' : index + 1}</div><div>${label}</div></div>`;
  }).join('')}</div>`;
  const statusVisual = rejected ? `<div class="squares-loader rejected"><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div></div>`
    : collected ? `<img class="collected-visual" src="selesai-kopi.webp" alt="Secawan kopi dan biji kopi - terima kasih">`
    : ready ? `<div class="ready-counter-visual"><img src="${LOGO_URL}" alt="K'fe De Sol - sila ambil pesanan"></div>`
    : `<div class="squares-loader"><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div></div>`;
  const statusMessage = rejected ? ('Maaf, pesanan anda ditolak' + (rejectReason ? '<br><small>Sebab: ' + rejectReason + '</small>' : ''))
    : collected ? 'Terima kasih! Pesanan telah diambil.'
    : ready ? 'Pesanan siap — sila datang ke kedai untuk pengambilan dan bayaran'
    : making ? 'Pesanan anda sedang dibuat'
    : 'Pesanan diterima — menunggu pengesahan kedai';

  return `
    <div class="waiting">
      ${tabsHtml}
      <div class="label">No. Giliran${order.customerName ? ' &middot; ' + order.customerName : ''}</div>
      <div class="queue-no">${String(order.queueNo).padStart(3,'0')}</div>
      ${roadmapHtml}
      ${statusVisual}
      <div class="prep-box big ${rejected?'rejected':(collected?'collected-message':(ready?'ready':''))}">${statusMessage}</div>
      <div class="order-items">${itemsHtml}<div class="row" style="border-top:1px solid #EFE2D2; margin-top:6px; padding-top:8px; font-weight:600;"><span>Jumlah</span><span>${fmt(order.total)}</span></div></div>
      <div class="payment-note">${rejected ? 'Sila buat pesanan baru jika masih ingin membeli.' : (collected ? 'Semoga berpuas hati dan jumpa lagi.' : (ready ? 'Sebut nombor giliran anda di kaunter.' : 'Sila buat bayaran di kaunter pembayaran'))}</div>
      ${!ready && !collected && !rejected && state.pushStatus === 'off' ? `<button class="push-nudge" id="pushOnWaiting" ${state.pushBusy ? 'disabled' : ''}>🔔 ${state.pushBusy ? 'Sedang mengaktifkan...' : 'Beritahu saya bila siap — walaupun app ditutup'}</button>` : ''}
      <button class="again-btn" id="orderAgain">Pesan Lagi</button>
    </div>
  `;
}

/* ---------- receipts (active and completed customer orders) ---------- */
function renderReceipts(){
  const receipts = getCustomerOrderHistory();
  if(receipts.length === 0){
    if((state.myOrderIds || []).length > 0 && (!state.receiptsLoadedOnce || state.receiptsLoading)){
      return `<div class="receipts-view"><h1 class="receipts-header">Resit Anda</h1><p>Menyemak resit aktif...</p></div>`;
    }
    return `<div class="waiting"><p>Tiada resit lagi.</p></div>`;
  }

  const renderReceiptCards = list => list.map(o => {
    const dateTimeStr = new Date(o.createdAt).toLocaleString('ms-MY', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
    const rejected = isOrderRejected(o);
    const active = orderStatus(o) !== 'selesai' && !rejected;
    const rejectReason = getRejectReason(o);
    const itemsHtml = o.items.map(i => `<div class="row"><span>${i.name} x${i.qty}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('');
    return `
      <div class="receipt-card ${active?'active-card':''}">
        <div class="receipt-stamp ${active?'active':(rejected?'rejected':'')}">${active?'AKTIF':(rejected?'DITOLAK':'SELESAI')}</div>
        <div class="label">No. Giliran${o.customerName ? ' &middot; ' + o.customerName : ''}</div>
        <div class="queue-no small">${String(o.queueNo).padStart(3,'0')}</div>
        <div class="receipt-datetime">${dateTimeStr}</div>
        ${rejected ? `<div class="receipt-reject-reason">Sebab: ${rejectReason || 'Lain-lain'}</div>` : ''}
        <div class="receipt-divider"></div>
        <div class="order-items">${itemsHtml}<div class="row" style="border-top:1px solid #EFE2D2; margin-top:6px; padding-top:8px; font-weight:600;"><span>Jumlah</span><span>${fmt(o.total)}</span></div></div>
        <div class="receipt-footer">${active ? orderStatusLabel(o) : (rejected ? 'Rekod pesanan ditolak — tiada bayaran/jualan direkodkan.' : 'Terima kasih atas sokongan anda &#9749;')}</div>
        ${active?`<button class="receipt-open-order" data-open-active-order="${o.id}">Lihat pesanan aktif</button>`:''}
      </div>
    `;
  }).join('');

  const activeReceipts = receipts.filter(o => orderStatus(o) !== 'selesai' && !isOrderRejected(o));
  const completedReceipts = receipts.filter(o => orderStatus(o) === 'selesai' || isOrderRejected(o));
  const cardsHtml = `${activeReceipts.length ? `<div class="receipt-section-title">Aktif</div>${renderReceiptCards(activeReceipts)}` : ''}
    ${completedReceipts.length ? `<div class="receipt-section-title">Selesai</div>${renderReceiptCards(completedReceipts)}` : ''}`;

  return `
    <div class="receipts-view">
      <h1 class="receipts-header">Resit Anda</h1>
      <div class="receipt-list">${cardsHtml}</div>
    </div>
  `;
}

/* ---------- admin activity log (bell) ----------
   Kept on this device (localStorage), newest first, max 60 entries. Each entry
   has a key so the same event is never logged twice across polls or reloads. */
const ACTIVITY_LOG_KEY = 'kfedeSolActivityLog';
const ACTIVITY_SEEN_KEY = 'kfedeSolActivitySeen';
const ORDER_STATUS_LABEL = { pending:'Baru', sedang_dibuat:'Sedang Dibuat', siap:'Siap', selesai:'Selesai', rejected:'Ditolak' };
function loadActivityLog(){
  if(state.activityLog) return state.activityLog;
  try{ state.activityLog = JSON.parse(localStorage.getItem(ACTIVITY_LOG_KEY) || '[]'); }catch(e){ state.activityLog = []; }
  try{ state.activitySeen = Number(localStorage.getItem(ACTIVITY_SEEN_KEY)) || 0; }catch(e){ state.activitySeen = 0; }
  return state.activityLog;
}
function logActivity(key, type, text, ts){
  const log = loadActivityLog();
  if(log.some(e => e.key === key)) return;
  log.unshift({ key, type, text, ts: ts || Date.now() });
  log.sort((a,b) => b.ts - a.ts);
  log.length = Math.min(log.length, 60);
  try{ localStorage.setItem(ACTIVITY_LOG_KEY, JSON.stringify(log)); }catch(e){}
}
function activityUnreadCount(){
  const log = loadActivityLog();
  return log.filter(e => e.ts > (state.activitySeen || 0)).length;
}
const queueLabelOf = o => 'No. ' + String(o.queueNo).padStart(3,'0');
// Compare two order lists and log what changed (new orders, status changes).
function logOrderChanges(prev, next){
  const before = new Map((prev || []).map(o => [o.id, orderStatus(o)]));
  const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);
  (next || []).forEach(o => {
    const status = orderStatus(o);
    if(!before.has(o.id)){
      // On the first load only today's orders are worth listing.
      if(prev || o.createdAt >= startOfToday.getTime())
        logActivity('new:' + o.id, 'new', `Pesanan baru ${queueLabelOf(o)} daripada ${o.customerName || '-'} · ${fmt(Number(o.total) || 0)}`, o.createdAt);
    } else if(before.get(o.id) !== status && status !== 'pending'){
      logActivity(`st:${o.id}:${status}`, status, `${queueLabelOf(o)} (${o.customerName || '-'}) kini ${ORDER_STATUS_LABEL[status] || status}`);
    }
  });
}
function timeAgo(ts){
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if(s < 60) return 'baru sahaja';
  if(s < 3600) return Math.floor(s / 60) + ' minit lalu';
  if(s < 86400) return Math.floor(s / 3600) + ' jam lalu';
  return new Date(ts).toLocaleDateString('ms-MY', { day:'2-digit', month:'short' }) + ', ' + new Date(ts).toLocaleTimeString('ms-MY', { hour:'numeric', minute:'2-digit' });
}
function renderActivityPanel(){
  const log = loadActivityLog();
  const seenBefore = state.activitySeenBefore || 0;
  const icon = { new:'🛎️', sedang_dibuat:'👨‍🍳', siap:'✅', selesai:'☕', rejected:'⛔', redeem:'🎁', admin:'👤' };
  return `<div class="activity-panel" role="dialog" aria-label="Log aktiviti">
    <div class="activity-head"><strong>Log Aktiviti</strong><button type="button" class="activity-clear" id="activityClear">Kosongkan</button></div>
    <div class="activity-list">
      ${log.length ? log.map(e => `
        <div class="activity-item ${e.ts > seenBefore ? 'unread' : ''}">
          <span class="activity-icon" aria-hidden="true">${icon[e.type] || '•'}</span>
          <div><div class="activity-text">${escapeHtml(e.text)}</div><div class="activity-time">${timeAgo(e.ts)}</div></div>
        </div>`).join('') : '<div class="activity-empty">Belum ada aktiviti.</div>'}
    </div>
  </div>`;
}

    String(c.name || '').toLowerCase().includes(q) ||
    (qDigits.length >= 3 && (custKey(c.phone).includes(qDigits) || String(c.referralCode || '').includes(qDigits)))
  ).slice(0, 8) : [];
  const picked = Array.isArray(custs) && state.rwCustomer ? custs.find(c => custKey(c.phone) === state.rwCustomer) : null;

  let redeemBody = '';
  if(custs === undefined || state.allCustomersLoading) redeemBody = '<div class="empty-msg">Memuat senarai pelanggan...</div>';
  else if(custs === null) redeemBody = '<div class="sys-warn">⚠️ Senarai pelanggan tidak dapat dimuat. Pastikan Apps Script sudah dikemas kini ke <b>Code_v3_for_v3.10.0.gs</b>.</div>';
  else if(picked){
    const have = Number(picked.points) || 0;
    const options = (rewards || []).filter(r => rewardStatus(r) === 'available').map(r => {
      const ok = have >= r.points;
      return `<div class="rw-redeem-row">
        ${rewardImageHtml(r, 'rw-thumb')}
        <div class="rw-redeem-info"><b>${escapeHtml(r.title)}</b><small>${r.points.toLocaleString('ms-MY')} points${ok ? '' : ` · kurang ${(r.points - have).toLocaleString('ms-MY')}`}</small></div>
        <button type="button" class="rw-redeem-btn" data-rw-redeem="${escapeHtml(r.id)}" ${ok && !state.rwBusy ? '' : 'disabled'}>Tebus</button>
      </div>`;
    }).join('');
    redeemBody = `<div class="rw-picked">
        <div class="rw-picked-main"><b>${escapeHtml(picked.name || 'Tanpa nama')}</b><small>${escapeHtml(picked.phone)}${picked.referralCode ? ` · Kod ${formatReferralCode(picked.referralCode)}` : ''}</small></div>
        <div class="rw-picked-pts"><b>${have.toLocaleString('ms-MY')}</b><small>points</small></div>
        <div class="rw-picked-pts rm"><b>${formatRM(picked.rm || 0)}</b><small>duit</small></div>
      </div>
      <div class="rw-use-rm">
        <span>💰 Guna baki duit${picked.friends ? ` · ${picked.friends} kawan diajak` : ''}</span>
        <input id="rwUseRm" class="rw-input" type="number" min="0" step="0.5" inputmode="decimal" placeholder="RM" value="${escapeHtml(state.rwUseRm || '')}" ${(picked.rm || 0) > 0 ? '' : 'disabled'}>
        <button type="button" class="rw-redeem-btn" id="rwUseRmBtn" ${(picked.rm || 0) > 0 && !state.rwBusy ? '' : 'disabled'}>Tolak</button>
      </div>
      <div class="rw-redeem-list">${options || '<div class="empty-msg">Belum ada hadiah. Tambah hadiah di bawah dahulu.</div>'}</div>
      <button type="button" class="push-btn ghost" id="rwClear">Pilih pelanggan lain</button>`;
  } else {
    redeemBody = `<input id="rwSearch" type="search" class="rw-input" placeholder="Cari nama, no. telefon atau kod referral" value="${escapeHtml(state.rwSearch || '')}" autocomplete="off">
      ${q ? `<div class="rw-matches">${matches.map(c => `<button type="button" class="rw-match" data-rw-pick="${escapeHtml(custKey(c.phone))}">
          <span><b>${escapeHtml(c.name || 'Tanpa nama')}</b><small>${escapeHtml(c.phone)}${c.referralCode ? ` · Kod ${formatReferralCode(c.referralCode)}` : ''}</small></span>
          <em>${(Number(c.points) || 0).toLocaleString('ms-MY')} pts${c.rm ? ` · ${formatRM(c.rm)}` : ''}</em></button>`).join('') || '<div class="empty-msg">Tiada pelanggan sepadan.</div>'}</div>` : ''}`;
  }

  const editing = state.rwEditId ? (rewards || []).find(r => r.id === state.rwEditId) : null;
  const preview = state.rwFilePreview || (editing && editing.imageUrl ? promotionDisplayUrl(editing.imageUrl) : '');
  const list = rewards === null
    ? `<div class="empty-msg">${state.rewardsError ? 'Senarai hadiah tidak dapat dimuat.' : 'Memuat senarai hadiah...'}</div>`
    : rewards.length ? `<div class="rw-admin-grid">${rewards.map(r => `
        <div class="rw-admin-card status-${rewardStatus(r)}">
          ${rewardImageHtml(r, 'rw-admin-img')}
          <div class="rw-admin-title">${escapeHtml(r.title)}</div>
          <div class="rw-admin-pts">${r.points.toLocaleString('ms-MY')} points <span class="reward-status ${rewardStatus(r)}">${REWARD_STATUS[rewardStatus(r)]}</span></div>
          <select class="rw-status-select" data-rw-status="${escapeHtml(r.id)}" aria-label="Status hadiah" >${Object.entries(REWARD_STATUS).map(([k, l]) => `<option value="${k}" ${rewardStatus(r) === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <div class="promotion-admin-actions">
            <button type="button" class="promotion-admin-action" data-rw-edit="${escapeHtml(r.id)}">Edit</button>
            <button type="button" class="promotion-admin-action delete" data-rw-delete="${escapeHtml(r.id)}">Padam</button>
          </div>
        </div>`).join('')}</div>`
    : '<div class="empty-msg">Belum ada hadiah. Tambah hadiah pertama di atas.</div>';

  return `
    <section class="promotion-admin-panel">
      <div class="promotion-admin-heading">
        <h3>🎁 Tebus Points &amp; Duit Pelanggan</h3>
        <p>Pelanggan tunjuk skrin hadiah di kaunter. Cari pelanggan, pilih hadiah, tekan Tebus, atau tolak baki duit referral. Ditolak serta-merta.</p>
      </div>
      ${redeemBody}
    </section>
    <section class="promotion-admin-panel" id="rwFormPanel">
      <div class="promotion-admin-heading">
        <h3>${editing ? 'Edit Hadiah' : 'Tambah Hadiah'}</h3>
        <p>Hadiah dipaparkan kepada pelanggan di page Reward, disusun ikut points (paling sedikit dahulu).</p>
      </div>
      <div class="rw-form">
        <label class="rw-photo-pick" for="rwFile">
          ${preview ? `<img src="${escapeHtml(preview)}" alt="">` : `<span>${ICON_GIFT}<small>Pilih gambar WebP</small></span>`}
        </label>
        <input id="rwFile" type="file" accept="image/webp,.webp" hidden ${state.rwSaving ? 'disabled' : ''}>
        <div class="rw-fields">
          <label>Nama hadiah<input id="rwTitle" class="rw-input" maxlength="60" placeholder="Cth: 1 Kopi Percuma" value="${escapeHtml(state.rwTitle || '')}"></label>
          <label>Points diperlukan<input id="rwPoints" class="rw-input" type="number" min="1" max="100000" inputmode="numeric" placeholder="Cth: 20" value="${escapeHtml(state.rwPoints || '')}"></label>
          <label>Status
            <select class="rw-status-select" id="rwStatusSel" >${Object.entries(REWARD_STATUS).map(([k, l]) => `<option value="${k}" ${(state.rwStatusSel || 'available') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
          </label>
          <div class="promotion-upload-hint">Tersedia = boleh ditebus · Habis &amp; Akan Datang = nampak tapi belum boleh ditebus · Tidak Tersedia = tidak dipaparkan kepada pelanggan</div>
          <div class="promotion-upload-hint">Gambar WebP sahaja · maksimum 5 MB${editing ? ' · biarkan kosong untuk kekalkan gambar lama' : ''}</div>
          <div class="push-actions">
            ${editing ? '<button type="button" class="push-btn ghost" id="rwCancel">Batal</button>' : ''}
            <button type="button" class="push-btn primary" id="rwSave" ${state.rwSaving ? 'disabled' : ''}>${state.rwSaving ? 'Menyimpan...' : editing ? 'Simpan Perubahan' : '+ Tambah Hadiah'}</button>
          </div>
          ${state.rwStatus ? `<div class="push-msg" role="status">${state.rwStatus}</div>` : ''}
        </div>
      </div>
    </section>
    <section class="promotion-admin-panel">
      <div class="promotion-admin-heading"><h3>Senarai Hadiah</h3></div>
      ${list}
    </section>
    <section class="promotion-admin-panel">
      <div class="promotion-admin-heading">
        <h3>Tetapan Points</h3>
        <p>Points yang pelanggan dapat untuk setiap cawan, bila pesanan Selesai (sudah bayar).</p>
      </div>
      <div class="rw-percup">
        <input id="rwPerCup" class="rw-input" type="number" min="0" max="100" inputmode="numeric" value="${escapeHtml(state.rwPerCup != null ? state.rwPerCup : String(state.pointsPerCup != null ? state.pointsPerCup : 2))}">
        <span>points / cawan</span>
        <button type="button" class="push-btn primary" id="rwPerCupSave" ${state.rwPerCupBusy ? 'disabled' : ''}>${state.rwPerCupBusy ? 'Menyimpan...' : 'Simpan'}</button>
      </div>
    </section>
    <section class="promotion-admin-panel">
      <div class="promotion-admin-heading">
        <h3>💰 Tetapan Duit Referral</h3>
        <p>Pengajak dapat duit untuk setiap pembelian (satu order) kawan baru yang Selesai, untuk beberapa pembelian pertama sahaja.</p>
      </div>
      <div class="rw-percup">
        <span>RM</span>
        <input id="rwRefRm" class="rw-input" type="number" min="0" max="100" step="0.5" inputmode="decimal" value="${escapeHtml(state.rwRefRm != null ? state.rwRefRm : String(state.refRm != null ? state.refRm : 1))}">
        <span>setiap pembelian, untuk</span>
        <input id="rwRefMax" class="rw-input" type="number" min="0" max="100" inputmode="numeric" value="${escapeHtml(state.rwRefMax != null ? state.rwRefMax : String(state.refMax != null ? state.refMax : 3))}">
        <span>pembelian pertama</span>
        <button type="button" class="push-btn primary" id="rwRefSave" ${state.rwRefBusy ? 'disabled' : ''}>${state.rwRefBusy ? 'Menyimpan...' : 'Simpan'}</button>
      </div>
    </section>`;
}

function resetRewardForm(){
  if(state.rwFilePreview) URL.revokeObjectURL(state.rwFilePreview);
  Object.assign(state, { rwEditId:null, rwTitle:'', rwPoints:'', rwStatusSel:'available', rwFile:null, rwFilePreview:'' });
}
function rewardError(r, fallback){
  const map = { SESSION_INVALID:'Sesi Admin tamat. Log masuk semula.', TITLE_EMPTY:'Isi nama hadiah.', INVALID_POINTS:'Points mesti nombor 1 hingga 100000.',
    JENIS_FAIL_TIDAK_DISOKONG:'Gambar mesti WebP.', SAIZ_GAMBAR_MELEBIHI_5MB:'Gambar melebihi 5 MB.', REWARD_NOT_FOUND:'Hadiah tidak dijumpai. Muat semula page.',
    NOT_ENOUGH_POINTS:'Points pelanggan tidak cukup.', REWARD_NOT_AVAILABLE:'Hadiah ini bukan Tersedia, tidak boleh ditebus.', NO_CUSTOMER:'Pelanggan tidak dijumpai.', 'unknown action':'Apps Script belum dikemas kini ke v3.10.0.' };
  return (r && map[r.error]) || fallback;
}
function upsertLocalReward(reward){
  state.rewards = (state.rewards || []).filter(r => r.id !== reward.id).concat(reward)
    .sort((a, b) => a.points - b.points || a.createdAt - b.createdAt);
}
async function saveRewardForm(){
  if(state.rwSaving) return;
  const title = String(state.rwTitle || '').trim();
  const points = Math.floor(Number(state.rwPoints));
  if(!title){ showToast('Isi nama hadiah.', 'error'); return; }
  if(!(points >= 1 && points <= 100000)){ showToast('Points mesti nombor 1 hingga 100000.', 'error'); return; }
  const file = state.rwFile;
  const body = { id: state.rwEditId || '', title, points, status: state.rwStatusSel || 'available' };
  state.rwSaving = true; state.rwStatus = file ? 'Memuat naik gambar...' : 'Menyimpan...'; render();
  try{
    if(file){ body.base64 = await readPromotionFile(file); body.mimeType = file.type; }
    const r = await gasPost('saveReward', body, 90000);
    if(!r || !r.ok || !r.reward) throw new Error(rewardError(r, 'Hadiah tidak berjaya disimpan. Semak sambungan.'));
    upsertLocalReward(r.reward);
    showToast(state.rwEditId ? 'Hadiah dikemas kini.' : 'Hadiah ditambah.', 'success');
    resetRewardForm();
    state.rwStatus = '';
  }catch(e){
    state.rwStatus = escapeHtml(e.message);
    showToast(e.message, 'error');
  }finally{
    state.rwSaving = false;
    render();
  }
}
async function setRewardStatus(id, status){
  const item = (state.rewards || []).find(r => r.id === id);
  if(!item || !REWARD_STATUS[status]) return;
  const r = await gasPost('saveReward', { id, title:item.title, points:item.points, status }, 30000);
  if(!r || !r.ok || !r.reward){ showToast(rewardError(r, 'Status tidak berjaya ditukar.'), 'error'); render(); return; }
  upsertLocalReward(r.reward);
  showToast(`${item.title}: ${REWARD_STATUS[status]}`, 'success');
  render();
}
async function deleteRewardItem(id){
  const item = (state.rewards || []).find(r => r.id === id);
  if(!item) return;
  const sure = await confirmDialog({ title:'Padam hadiah?', message:`"${item.title}" akan dibuang daripada senarai. Points pelanggan tidak terjejas.`, confirmText:'Ya, padam', cancelText:'Tidak', danger:true });
  if(!sure) return;
  const r = await gasPost('deleteReward', { id }, 30000);
  if(!r || !r.ok){ showToast(rewardError(r, 'Hadiah tidak berjaya dipadam.'), 'error'); return; }
  state.rewards = (state.rewards || []).filter(x => x.id !== id);
  if(state.rwEditId === id) resetRewardForm();
  showToast('Hadiah dipadam.', 'success');
  render();
}
async function redeemRewardFor(phoneKey, rewardId){
  const c = (state.allCustomers || []).find(x => custKey(x.phone) === phoneKey);
  const item = (state.rewards || []).find(r => r.id === rewardId);
  if(!c || !item || state.rwBusy) return;
  const have = Number(c.points) || 0;
  const sure = await confirmDialog({ title:`Tebus ${item.title}?`, message:`${c.name || c.phone}: tolak ${item.points} points (baki ${have} → ${have - item.points}).`, confirmText:'Ya, tebus', cancelText:'Tidak' });
  if(!sure) return;
  state.rwBusy = true; render();
  try{
    const r = await gasPost('redeemReward', { phone:c.phone, rewardId }, 30000);
    if(r && r.points != null) c.points = r.points;
    if(!r || !r.ok) throw new Error(rewardError(r, 'Tebus tidak berjaya. Semak sambungan.'));
    showToast(`✅ ${item.title} ditebus untuk ${c.name || c.phone}. Baki ${r.points} points.`, 'success');
    logActivity('reward:' + phoneKey + ':' + Date.now(), 'redeem', `${c.name || c.phone} tebus ${item.title} (−${item.points} points)`);
  }catch(e){ showToast(e.message, 'error'); }
  finally{ state.rwBusy = false; render(); }
}
async function useCustomerBalance(phoneKey){
  const c = (state.allCustomers || []).find(x => custKey(x.phone) === phoneKey);
  const amount = Math.round(Number(state.rwUseRm) * 100) / 100;
  if(!c || state.rwBusy) return;
  if(!(amount > 0)){ showToast('Masukkan jumlah RM.', 'error'); return; }
  if(amount > (c.rm || 0)){ showToast(`Baki ${c.name || c.phone} cuma ${formatRM(c.rm || 0)}.`, 'error'); return; }
  const sure = await confirmDialog({ title:`Tolak ${formatRM(amount)}?`, message:`${c.name || c.phone}: baki duit ${formatRM(c.rm)} → ${formatRM(c.rm - amount)}.`, confirmText:'Ya, tolak', cancelText:'Tidak' });
  if(!sure) return;
  state.rwBusy = true; render();
  try{
    const r = await gasPost('useBalance', { phone:c.phone, amount }, 30000);
    if(r && r.rm != null) c.rm = r.rm;
    if(!r || !r.ok) throw new Error(r && r.error === 'NOT_ENOUGH_BALANCE' ? 'Baki duit tidak cukup.' : rewardError(r, 'Tidak berjaya. Semak sambungan.'));
    state.rwUseRm = '';
    showToast(`✅ ${formatRM(amount)} ditolak untuk ${c.name || c.phone}. Baki ${formatRM(r.rm)}.`, 'success');
    logActivity('rm:' + phoneKey + ':' + Date.now(), 'redeem', `${c.name || c.phone} guna baki duit ${formatRM(amount)}`);
  }catch(e){ showToast(e.message, 'error'); }
  finally{ state.rwBusy = false; render(); }
}
async function saveReferralSettings(){
  const rm = Math.round(Number(state.rwRefRm != null ? state.rwRefRm : state.refRm) * 100) / 100;
  const max = Math.floor(Number(state.rwRefMax != null ? state.rwRefMax : state.refMax));
  if(!(rm >= 0 && rm <= 100) || !(max >= 0 && max <= 100)){ showToast('Nilai tidak sah.', 'error'); return; }
  state.rwRefBusy = true; render();
  const a = await gasPost('setMeta', { key:'referral-rm', value:String(rm) }, 30000);
  const b = a && a.ok ? await gasPost('setMeta', { key:'referral-max', value:String(max) }, 30000) : null;
  state.rwRefBusy = false;
  if(b && b.ok){ state.refRm = rm; state.refMax = max; state.rwRefRm = null; state.rwRefMax = null; showToast(`Disimpan: ${formatRM(rm)} × ${max} pembelian pertama.`, 'success'); }
  else showToast(rewardError(b || a, 'Tetapan tidak berjaya disimpan.'), 'error');
  render();
}
async function savePointsPerCup(){
  const n = Math.floor(Number(state.rwPerCup != null ? state.rwPerCup : state.pointsPerCup));
  if(!(n >= 0 && n <= 100)){ showToast('Points setiap cawan mesti 0 hingga 100.', 'error'); return; }
  state.rwPerCupBusy = true; render();
  const r = await gasPost('setMeta', { key:'points-per-cup', value:String(n) }, 30000);
  state.rwPerCupBusy = false;
  if(r && r.ok){ state.pointsPerCup = n; state.rwPerCup = null; showToast(`Disimpan: ${n} points setiap cawan.`, 'success'); }
  else showToast(rewardError(r, 'Tetapan tidak berjaya disimpan.'), 'error');
  render();
}

/* ---------- admin: pesanan tab (grouped by customer) ---------- */
function renderAdminPesanan(){
  const holidayNotice = state.shopClosed && state.shopClosedFrom && state.shopClosedUntil
    ? `<div class="holiday-blink">CUTI: ${state.shopClosedFrom} hingga ${state.shopClosedUntil}</div>`
    : state.shopOutsideHours ? '<div class="holiday-blink" style="animation:none">LUAR WAKTU OPERASI: pelanggan tidak boleh order. Buka waktu tambahan di tab Pengurusan.</div>' : '';
  // Right after login the first orders request is still on its way.
  if(state.allOrders == null) return holidayNotice + `<div class="empty-msg">Memuat pesanan...</div>`;
  // Keep rejected orders in Sheets for audit/history, but remove them from the
  // admin's active work queue as soon as the rejection succeeds.
  const orders = (state.allOrders || []).filter(o => {
    const status = orderStatus(o);
    return status !== 'selesai' && status !== 'rejected';
  })
    .slice().sort((a,b) => a.createdAt - b.createdAt);
  if(orders.length === 0){
    return holidayNotice + `<div class="empty-msg">Belum ada pesanan masuk.</div>`;
  }

  let html = holidayNotice + `<div class="customer-groups">` + orders.map(o => {
    const time = new Date(o.createdAt).toLocaleTimeString('ms-MY', {hour:'2-digit', minute:'2-digit'});
    const dateTimeStr = new Date(o.createdAt).toLocaleString('ms-MY', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
    let totalQty = 0, totalPrice = 0;
    const tableRows = o.items.map(i => {
      totalQty += i.qty;
      totalPrice += i.qty * i.price;
      return `
        <tr>
          <td>${i.name}</td>
          <td>x${i.qty}</td>
          <td>${time}</td>
          <td>${fmt(i.qty * i.price)}</td>
        </tr>
      `;
    }).join('');

    const phone = o.customerPhone || '';
    const cust = state.customerReport ? state.customerReport[phone] : null;
    let loyaltyBadge = '';
    const freeCount = cust ? freeDrinksAvailable(cust) : 0;
    if(freeCount > 0){
      loyaltyBadge = `<button class="redeem-btn" data-phone="${phone}" data-count="${freeCount}">🎁 Layak dapat x${freeCount} kopi percuma &middot; tekan untuk redeem</button>`;
    }

    const rejected = isOrderRejected(o);
    const rejectReason = getRejectReason(o);
    const allReady = orderStatus(o) === 'siap';
    const acknowledged = state.acknowledgedOrderIds.has(o.id) || orderStatus(o) === 'sedang_dibuat' || allReady || rejected;
    const hasNewOrder = !acknowledged;
    const readyCheck = allReady ? `<span class="cg-ready-check">&#10003;</span>` : '';
    const rejectedBadge = rejected ? `<span class="cg-rejected-badge">&#10005; Rejected</span>` : '';
    const rejectReasonHtml = rejected && rejectReason ? `<div class="cg-reject-reason">Sebab reject: ${rejectReason}</div>` : '';
    const siapBtn = rejected ? '' : (allReady ? `<button class="btn-siap is-ready" disabled>Siap</button>` : `<button class="btn-siap" data-id="${o.id}" ${acknowledged ? '' : 'disabled'}>Siap</button>`);
    const rejectBtn = (!allReady && !rejected) ? `<button class="btn-reject" data-id="${o.id}" ${acknowledged ? '' : 'disabled'}>Reject</button>` : '';

    const ackBtn = hasNewOrder ? `<button class="btn-ack" data-ids="${o.id}">✓ Acknowledge</button>` : '';

    const selesaiBtn = rejected ? '' : `<button class="btn-selesai" data-id="${o.id}" ${(acknowledged && allReady) ? '' : 'disabled'}>Selesai</button>`;

    const resitBtn = rejected ? '' : `<button class="btn-resit" data-id="${o.id}" ${allReady ? '' : 'disabled'}>Resit</button>`;

    const waSent = state.whatsappSentIds.has(o.id);
    const waBtn = (allReady && whatsappNumber(o.customerPhone))
      ? `<a class="btn-wa${waSent ? ' sent' : ''}" data-id="${o.id}" href="${escapeHtml(whatsappUrl(o))}" target="_blank" rel="noopener" title="Buka WhatsApp dengan mesej pesanan siap">${ICON_WHATSAPP}${waSent ? 'WhatsApp ✓' : 'WhatsApp Customer'}</a>` : '';

    const queueLabel = `<div class="cg-queue">No: ${String(o.queueNo).padStart(3,'0')}</div>`;
    const statusKey = rejected ? '' : allReady ? 'siap' : orderStatus(o) === 'sedang_dibuat' ? 'dibuat' : 'baru';
    const statusPill = statusKey ? `<span class="cg-status ${statusKey}">${{baru:'Baru', dibuat:'Sedang Dibuat', siap:'Siap'}[statusKey]}</span>` : '';

    return `
      <div class="customer-group${hasNewOrder ? ' new-order' : ''}${statusKey ? ' status-' + statusKey : ''}">
        <div class="cg-header">
          <div class="cg-info">
            <div class="cg-name">${o.customerName || '-'}</div>
            <div class="cg-phone">${o.customerPhone || '-'}</div>
            <div class="cg-datetime">${dateTimeStr}</div>
            ${rejectReasonHtml}
          </div>
          <div class="cg-right">
            ${statusPill}
            ${queueLabel}
            ${loyaltyBadge}
            ${ackBtn}
          </div>
        </div>
        <table class="cg-table">
          <thead>
            <tr>
              <th>Jenis minuman</th>
              <th>Kuantiti</th>
              <th>Masa</th>
              <th>Harga</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
          <tfoot>
            <tr>
              <td>jumlah</td>
              <td>${totalQty} cawan</td>
              <td></td>
              <td>${fmt(totalPrice)}</td>
            </tr>
          </tfoot>
        </table>
        <div class="cg-actions">
          ${readyCheck}
          ${rejectedBadge}
          ${siapBtn}
          ${waBtn}
          ${rejectBtn}
          ${selesaiBtn}
          ${resitBtn}
        </div>
      </div>
    `;
  }).join('') + `</div>`;

  return html;
}

/* ---------- admin: simpanan pelanggan tab ---------- */
function renderAdminSimpanan(){
  const orders = (state.allOrders || []).filter(o => {
    const status = orderStatus(o);
    return status === 'selesai' || status === 'rejected';
  });
  let html = '';

  if(orders.length === 0){
    html += `<div class="empty-msg">Tiada pelanggan dalam simpanan lagi.</div>`;
  } else {
    const groups = {};
    const order_seq = [];
    orders.forEach(o => {
      const key = o.customerPhone || o.customerName || o.id;
      if(!groups[key]){
        groups[key] = { name: o.customerName || '-', phone: o.customerPhone || '-', orders: [] };
        order_seq.push(key);
      }
      groups[key].orders.push(o);
    });

    html += `<div class="customer-groups simpanan-list">` + order_seq.reverse().map((key, idx) => {
      const g = groups[key];
      g.orders.sort((a,b) => b.createdAt - a.createdAt);
      const completedOrders = g.orders.filter(o => orderStatus(o) === 'selesai');
      const rejectedOrders = g.orders.filter(isOrderRejected);
      const totalQty = completedOrders.reduce((s,o) => s + o.items.reduce((s2,i)=>s2+i.qty,0), 0);
      const totalPrice = completedOrders.reduce((s,o) => s + o.total, 0);
      const lastDateTime = new Date(g.orders[0].createdAt).toLocaleString('ms-MY', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
      const latestQueueNo = g.orders[0].queueNo;
      const expandKey = 'simpanan-' + idx;
      const expanded = state.simpananExpanded === expandKey;

      let detailHtml = '';
      if(expanded){
        detailHtml = `<div class="cg-simpanan-detail">` + g.orders.map(o => {
          const time = new Date(o.createdAt).toLocaleTimeString('ms-MY', {hour:'2-digit', minute:'2-digit'});
          const rejected = isOrderRejected(o);
          const rejectReason = getRejectReason(o);
          const rows = o.items.map(i => `
            <tr>
              <td>${i.name}</td>
              <td>x${i.qty}</td>
              <td>${fmt(i.qty * i.price)}</td>
            </tr>
          `).join('');
          return `
            <div class="cg-order-block">
              <div class="oi-meta">No: ${String(o.queueNo).padStart(3,'0')} &middot; ${time} &middot; ${rejected ? '<strong style="color:#C62828">DITOLAK</strong>' : '<strong style="color:#2E7D32">SELESAI</strong>'}</div>
              ${rejected ? `<div class="cg-reject-reason">Sebab reject: ${rejectReason || 'Lain-lain'}</div>` : ''}
              <table class="cg-table">
                <thead>
                  <tr><th>Jenis minuman</th><th>Kuantiti</th><th>Harga</th></tr>
                </thead>
                <tbody>${rows}</tbody>
                <tfoot>
                  <tr><td>jumlah</td><td></td><td>${fmt(o.total)}</td></tr>
                </tfoot>
              </table>
            </div>
          `;
        }).join('') + `</div>`;
      }

      return `
        <div class="customer-group done-group${expanded?' expanded':''}" data-key="${expandKey}">
          <div class="cg-header">
            <div class="cg-info">
              <div class="cg-name">${g.name}</div>
              <div class="cg-phone">${g.phone}</div>
              <div class="cg-datetime">${lastDateTime}</div>
            </div>
            <div class="cg-right">
              <div class="cg-queue">No: ${String(latestQueueNo).padStart(3,'0')}</div>
              <button class="btn-simpanan-pdf" data-customer-key="${key}">PDF</button>
            </div>
          </div>
          <div class="cg-footer">
            <div>${completedOrders.length} selesai &middot; ${rejectedOrders.length} ditolak &middot; ${totalQty} cawan &middot; ${fmt(totalPrice)}</div>
            <div class="oi-meta"><span class="cg-toggle-arrow">${expanded?'▲':'▼'}</span></div>
          </div>
          ${detailHtml}
        </div>
      `;
    }).join('') + `</div>`;
  }

  html += renderCustomerReport();
  return html;
}

/* ---------- admin: dashboard tab ---------- */
function renderAdminDashboard(){
  const orders = state.allOrders || [];
  const now = new Date();
  const isToday = (ts) => {
    const d = new Date(ts);
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  };
  // Rejected orders were never sold, so they stay out of every sales figure.
  const todays = orders.filter(o => isToday(o.createdAt) && !isOrderRejected(o));
  const todaySales = todays.reduce((s,o) => s + o.total, 0);
  const todayCups = todays.reduce((s,o) => s + o.items.reduce((s2,i)=>s2+i.qty,0), 0);
  const pendingCount = orders.filter(o => orderStatus(o) === 'pending').length;
  const readyCount = orders.filter(o => orderStatus(o) === 'siap').length;
  const doneCount = orders.filter(o => orderStatus(o) === 'selesai').length;

  const customers = state.customerReport || {};
  const customerCount = Object.keys(customers).length;
  const customerList = Object.entries(customers)
    .map(([phone, c]) => ({ phone, name: c.name, qty: c.qty||0, count: c.count }))
    .sort((a,b) => (a.name||'').localeCompare(b.name||''));
  const loyaltyList = Object.entries(customers)
    .map(([phone, c]) => ({ phone, name: c.name, qty: c.qty||0, free: freeDrinksAvailable(c), redeemed: (c.redeems||[]).length }))
    .filter(c => c.free > 0)
    .sort((a,b) => b.free - a.free);
  const loyaltyCount = loyaltyList.length;

  // breakdown of today's items: name -> {qty, sales}
  const breakdown = {};
  todays.forEach(o => {
    o.items.forEach(i => {
      if(!breakdown[i.name]) breakdown[i.name] = { qty: 0, sales: 0 };
      breakdown[i.name].qty += i.qty;
      breakdown[i.name].sales += i.qty * i.price;
    });
  });
  const breakdownRows = Object.entries(breakdown).sort((a,b)=>b[1].qty-a[1].qty);

  const exp = state.dashExpanded;

  // Yesterday, for the "vs semalam" change on each headline card.
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  const isYesterday = ts => { const d = new Date(ts); return d.toDateString() === yest.toDateString(); };
  const yOrders = orders.filter(o => isYesterday(o.createdAt) && !isOrderRejected(o));
  const ySales = yOrders.reduce((s,o) => s + o.total, 0);
  const yCups = yOrders.reduce((s,o) => s + o.items.reduce((s2,i)=>s2+i.qty,0), 0);
  const delta = (today, before) => {
    if(!before && !today) return `<span class="kpi-delta flat">— sama</span>`;
    if(!before) return `<span class="kpi-delta up">↗ baru</span>`;
    const pct = Math.round((today - before) / before * 100);
    if(pct === 0) return `<span class="kpi-delta flat">— sama</span>`;
    return `<span class="kpi-delta ${pct > 0 ? 'up' : 'down'}">${pct > 0 ? '↗' : '↘'} ${Math.abs(pct)}%</span>`;
  };

  const kpis = [
    { key:'jualan', label:'Jualan Hari Ini', value: fmt(todaySales), icon:DASH_ICONS.money, note: delta(todaySales, ySales) + ' vs semalam', detail:true },
    { key:'pesanan', label:'Pesanan Hari Ini', value: todays.length, icon:DASH_ICONS.receipt, note: delta(todays.length, yOrders.length) + ' vs semalam', detail:true },
    { key:'cawan', label:'Cawan Terjual', value: todayCups, icon:iconCup('hot'), note: delta(todayCups, yCups) + ' vs semalam', detail:false },
    { key:'pelanggan', label:'Pelanggan Bulan Ini', value: customerCount, icon:DASH_ICONS.users, note:'<span class="kpi-note">bulan ini</span>', detail:true },
  ];
  const minis = [
    { key:'pending', label:'Menunggu', value: pendingCount, tone:'baru', detail:false },
    { key:'siap', label:'Siap, belum diambil', value: readyCount, tone:'siap', detail:false },
    { key:'selesai', label:'Selesai', value: doneCount, tone:'done', detail:false },
    { key:'layak', label:'Layak kopi percuma', value: loyaltyCount, tone:'gold', detail:true },
  ];
  const kpiHtml = kpis.map(c => `
    <div class="dash-card kpi-card ${exp===c.key?'expanded':''}" data-key="${c.key}" data-detail="${c.detail}">
      <div class="kpi-top"><span class="kpi-icon" aria-hidden="true">${c.icon}</span><span class="dash-label">${c.label}</span></div>
      <div class="dash-value">${c.value}</div>
      <div class="kpi-foot">${c.note}</div>
    </div>`).join('');
  const miniHtml = minis.map(c => {
    const isLayakReady = c.key === 'layak' && loyaltyCount > 0 && exp !== 'layak';
    return `
    <div class="dash-card mini-card tone-${c.tone} ${exp===c.key?'expanded':''} ${isLayakReady?'layak-ready':''}" data-key="${c.key}" data-detail="${c.detail}">
      <span class="dash-value">${c.value}</span><span class="dash-label">${c.label}</span>
    </div>`;
  }).join('');

  const shopOpen = !state.shopClosed && !state.shopOutsideHours;
  const adminName = (state.loggedInAdmin && state.loggedInAdmin.name) || 'Admin';
  let html = `<div class="dash2">
    <section class="dash2-welcome">
      <div>
        <div class="dash2-hello">Selamat kembali, ${escapeHtml(adminName)}</div>
        <div class="dash2-shop">K'fe De Sol</div>
      </div>
      <div class="dash2-status">Status Kedai <span class="${shopOpen ? 'on' : 'off'}">● ${shopOpen ? 'Buka' : (state.shopClosed ? 'Cuti' : 'Tutup')}</span></div>
      <img class="dash2-logo" src="kfe-de-sol-logo.svg" alt="K'fe De Sol">
    </section>
    <div class="dash2-grid">
      <div class="dash2-main">
        <div class="kpi-grid">${kpiHtml}</div>
        <div class="mini-grid">${miniHtml}</div>`;

  if(exp === 'pesanan' || exp === 'jualan'){
    const title = exp === 'pesanan' ? 'Butiran Pesanan Hari Ini' : 'Butiran Jualan Hari Ini';
    html += `<div class="dash-detail"><h3>${title}</h3>`;
    if(breakdownRows.length === 0){
      html += `<div class="dash-detail-row"><span>Tiada pesanan lagi hari ini.</span></div>`;
    } else {
      html += breakdownRows.map(([name, d]) => `
        <div class="dash-detail-row">
          <span>${name}</span>
          <span>${exp === 'pesanan' ? d.qty + ' cawan' : fmt(d.sales) + ' (' + d.qty + ' cawan)'}</span>
        </div>
      `).join('');
    }
    html += `</div>`;
  } else if(exp === 'layak'){
    html += `<div class="dash-detail"><h3>Pelanggan Layak Kopi Percuma</h3>`;
    if(loyaltyList.length === 0){
      html += `<div class="dash-detail-row"><span>Belum ada pelanggan layak bulan ini.</span></div>`;
    } else {
      html += loyaltyList.map(c => `
        <div class="loyalty-row">
          <div class="loyalty-info">
            <div class="loyalty-name">${c.name || '-'}</div>
            <div class="loyalty-phone">${c.phone}</div>
            <div class="loyalty-free">🎁 ${c.free} air free &middot; ${c.qty} cawan${c.redeemed ? ` &middot; ${c.redeemed} dah ditebus` : ''}</div>
          </div>
          <div class="loyalty-actions">
            <button class="redeem-btn" data-phone="${c.phone}" data-count="1">Redeem 1</button>
            ${c.free > 1 ? `<button class="redeem-btn redeem-all" data-phone="${c.phone}" data-count="${c.free}">Redeem Semua (${c.free})</button>` : ''}
          </div>
        </div>
      `).join('');
    }
    html += `</div>`;
  } else if(exp === 'pelanggan'){
    html += `<div class="dash-detail"><h3>Pelanggan Bulan Ini</h3>`;
    if(customerList.length === 0){
      html += `<div class="dash-detail-row"><span>Tiada pelanggan bulan ini.</span></div>`;
    } else {
      html += customerList.map(c => `
        <div class="dash-detail-row">
          <span>${c.name || '-'}</span>
          <span>${c.phone}</span>
        </div>
      `).join('');
    }
    html += `</div>`;
  }

  const days = getMonthlyDailyStats();
  const live = orders.filter(o => ['pending','sedang_dibuat','siap'].includes(orderStatus(o)))
    .sort((a,b) => b.createdAt - a.createdAt).slice(0, 5);
  const recent = orders.slice().sort((a,b) => b.createdAt - a.createdAt).slice(0, 6);
  const itemSummary = o => {
    const first = (o.items || [])[0];
    if(!first) return '-';
    const more = o.items.length - 1;
    return `${first.qty}x ${escapeHtml(first.name)}${more > 0 ? ` <small>+${more} lagi</small>` : ''}`;
  };
  const statusPill = o => {
    const s = orderStatus(o);
    const map = { pending:['baru','Baru'], sedang_dibuat:['dibuat','Dibuat'], siap:['siap','Siap'], selesai:['done','Selesai'], rejected:['rejected','Ditolak'] };
    const [cls, label] = map[s] || ['baru','Baru'];
    return `<span class="cg-status ${cls}">${label}</span>`;
  };
  const timeOf = ts => new Date(ts).toLocaleTimeString('ms-MY', {hour:'numeric', minute:'2-digit'});

  html += `
        <section class="dash2-panel">
          <div class="dash2-panel-head">
            <h3>Jualan vs Cawan</h3>
            <div class="dash2-legend"><span class="lg-sales">Jualan (RM)</span><span class="lg-cups">Cawan</span></div>
          </div>
          ${renderDashLineChart(days, now.getDate())}
        </section>
        <section class="dash2-panel">
          <div class="dash2-panel-head"><h3>Pesanan Terkini</h3><button type="button" class="dash2-link" data-goto-tab="pesanan">Lihat semua →</button></div>
          ${recent.length ? `<div class="dash2-table-wrap"><table class="dash2-table">
            <thead><tr><th>Minuman</th><th>No.</th><th>Pelanggan</th><th>Jumlah</th><th>Status</th></tr></thead>
            <tbody>${recent.map(o => `<tr>
              <td><span class="dash2-item-icon" aria-hidden="true">${iconCup('hot')}</span>${itemSummary(o)}<div class="dash2-sub">${timeOf(o.createdAt)}</div></td>
              <td>#${String(o.queueNo).padStart(3,'0')}</td>
              <td>${escapeHtml(o.customerName || '-')}</td>
              <td>${fmt(Number(o.total) || 0)}</td>
              <td>${statusPill(o)}</td></tr>`).join('')}</tbody></table></div>`
            : '<div class="dash2-empty">Belum ada pesanan bulan ini.</div>'}
        </section>
      </div>
      <aside class="dash2-side">
        ${renderDashGauge(todaySales, ySales, Math.max(0, ...days.map(d => d.jualan)))}
        <section class="dash2-panel">
          <div class="dash2-panel-head"><h3>Live Orders</h3><span class="dash2-live-dot">● LIVE</span></div>
          ${live.length ? live.map(o => `
            <div class="dash2-live">
              <div><strong>${escapeHtml(o.customerName || '-')}</strong> beli ${itemSummary(o)}
                <div class="dash2-sub">Hari ini · ${timeOf(o.createdAt)} · No. ${String(o.queueNo).padStart(3,'0')}</div></div>
              ${statusPill(o)}
            </div>`).join('') : '<div class="dash2-empty">Tiada pesanan aktif sekarang.</div>'}
          ${live.length ? '<button type="button" class="dash2-link block" data-goto-tab="pesanan">Buka Pesanan →</button>' : ''}
        </section>
        ${renderDashTopSelling(orders, now)}
      </aside>
    </div>
  </div>`;

  html += renderMonthlyReport();

  return html;
}

/* Smooth two-line chart for the month: sales (RM, left axis) and cups (right
   axis), with today's column highlighted. Plain SVG, no chart library. */
function renderDashLineChart(allDays, today){
  // Early in the month a 31-day axis squeezes the data into a corner, so the
  // axis runs to today (at least a week) and lines stop at today.
  const days = allDays.slice(0, Math.min(allDays.length, Math.max(today, 7)));
  const upto = Math.min(days.length, today);
  const W = 640, H = 230, L = 44, R = 36, T = 14, B = 26;
  const iw = W - L - R, ih = H - T - B;
  const maxS = Math.max(10, ...days.map(d => d.jualan));
  const maxC = Math.max(5, ...days.map(d => d.cawan));
  const x = i => L + (days.length > 1 ? i / (days.length - 1) : 0) * iw;
  const ys = v => T + ih - v / maxS * ih;
  const yc = v => T + ih - v / maxC * ih;
  // Flat-tangent curves: smooth, and never overshoot above a peak or below zero.
  const smooth = pts => pts.map((p, i) => {
    if(i === 0) return `M${p[0].toFixed(1)},${p[1].toFixed(1)}`;
    const p1 = pts[i - 1], dx = (p[0] - p1[0]) / 2.5;
    return `C${(p1[0] + dx).toFixed(1)},${p1[1].toFixed(1)} ${(p[0] - dx).toFixed(1)},${p[1].toFixed(1)} ${p[0].toFixed(1)},${p[1].toFixed(1)}`;
  }).join(' ');
  const shown = days.slice(0, upto);
  const sales = smooth(shown.map((d, i) => [x(i), ys(d.jualan)]));
  const cups = smooth(shown.map((d, i) => [x(i), yc(d.cawan)]));
  const grid = [0, .25, .5, .75, 1].map(f => {
    const y = T + ih - f * ih;
    return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="lc-grid"/>
      <text x="${L - 8}" y="${y + 4}" text-anchor="end" class="lc-axis">${Math.round(maxS * f)}</text>
      <text x="${W - R + 8}" y="${y + 4}" class="lc-axis">${Math.round(maxC * f)}</text>`;
  }).join('');
  const step = days.length <= 10 ? 1 : 5;
  const labels = days.filter(d => d.day === 1 || d.day % step === 0 || d.day === days.length)
    .map(d => `<text x="${x(d.day - 1)}" y="${H - 6}" text-anchor="middle" class="lc-axis">${d.day}</text>`).join('');
  const ti = upto - 1;
  const band = ti >= 0 ? `<rect x="${x(ti) - 9}" y="${T}" width="18" height="${ih}" rx="9" class="lc-today"/>` : '';
  const dots = ti >= 0 ? `<circle cx="${x(ti)}" cy="${ys(days[ti].jualan)}" r="5" class="lc-dot-s"/><circle cx="${x(ti)}" cy="${yc(days[ti].cawan)}" r="5" class="lc-dot-c"/>` : '';
  const hits = days.map((d, i) => `<rect x="${x(i) - iw / days.length / 2}" y="${T}" width="${iw / days.length}" height="${ih}" fill="transparent"><title>Hari ${d.day}: ${fmt(d.jualan)} · ${d.cawan} cawan</title></rect>`).join('');
  return `<svg class="dash2-line" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf jualan dan cawan harian bulan ini">
    <defs><linearGradient id="lcTodayGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6B4226" stop-opacity=".05"/><stop offset="1" stop-color="#6B4226" stop-opacity=".55"/></linearGradient></defs>
    ${grid}${band}
    <path d="${cups}" class="lc-cups"/>
    <path d="${sales}" class="lc-sales"/>
    ${dots}${labels}${hits}
  </svg>`;
}

/* Half-circle gauge: today's sales against the best day of the month. */
function renderDashGauge(todaySales, ySales, bestDay){
  const target = Math.max(bestDay, ySales, todaySales, 1);
  const ratio = Math.min(1, todaySales / target);
  const len = Math.PI * 80; // arc length for r=80
  return `<section class="dash2-panel dash2-gauge">
    <div class="dash2-panel-head"><h3>Prestasi Hari Ini</h3></div>
    <svg viewBox="0 0 200 104" aria-hidden="true">
      <path d="M20,100 A80,80 0 0 1 180,100" class="gauge-track"/>
      <path d="M20,100 A80,80 0 0 1 180,100" class="gauge-fill" style="stroke-dasharray:${len};stroke-dashoffset:${len * (1 - ratio)}"/>
    </svg>
    <div class="gauge-value">${fmt(todaySales)}</div>
    <div class="gauge-caption">Jualan hari ini · ${Math.round(ratio * 100)}% daripada hari terbaik</div>
    <div class="gauge-rows">
      <div><span class="lg-cups">Semalam</span><strong>${fmt(ySales)}</strong></div>
      <div><span class="lg-sales">Terbaik bulan ini</span><strong>${fmt(bestDay)}</strong></div>
    </div>
  </section>`;
}

/* Top selling drinks this month (rejected orders excluded). */
function renderDashTopSelling(orders, now){
  const tally = {};
  let total = 0;
  orders.forEach(o => {
    const d = new Date(o.createdAt);
    if(isOrderRejected(o) || d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear()) return;
    (o.items || []).forEach(i => {
      const name = String(i.name || '').replace(/\s*\((Hot|Ice)\)$/i, '');
      tally[name] = (tally[name] || 0) + (Number(i.qty) || 0);
      total += Number(i.qty) || 0;
    });
  });
  const top = Object.entries(tally).sort((a,b) => b[1] - a[1]).slice(0, 5);
  return `<section class="dash2-panel">
    <div class="dash2-panel-head"><h3>Paling Laris</h3><span class="dash2-sub">bulan ini</span></div>
    ${top.length ? `<div class="top-total"><strong>${total}</strong> cawan terjual</div>` + top.map(([name, qty]) => `
      <div class="top-row">
        <div class="top-label"><span>${escapeHtml(name)}</span><span>${qty} (${Math.round(qty / total * 100)}%)</span></div>
        <div class="top-bar"><span style="width:${Math.round(qty / top[0][1] * 100)}%"></span></div>
      </div>`).join('') : '<div class="dash2-empty">Belum ada jualan bulan ini.</div>'}
  </section>`;
}

/* ---------- admin: monthly report (daily breakdown + charts + export) ---------- */
function getMonthlyDailyStats(){
  const orders = state.allOrders || [];
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const days = [];
  for(let d = 1; d <= daysInMonth; d++){
    days.push({ day: d, pesanan: 0, jualan: 0, cawan: 0, pelangganSet: new Set() });
  }

  orders.forEach(o => {
    if(isOrderRejected(o)) return; // never sold
    const dt = new Date(o.createdAt);
    if(dt.getFullYear() === year && dt.getMonth() === month){
      const row = days[dt.getDate() - 1];
      row.pesanan += 1;
      row.jualan += o.total;
      row.cawan += o.items.reduce((s,i)=>s+i.qty, 0);
      row.pelangganSet.add(o.customerPhone || o.customerName || o.id);
    }
  });

  return days.map(d => ({
    day: d.day, pesanan: d.pesanan, jualan: d.jualan, cawan: d.cawan, pelanggan: d.pelangganSet.size
  }));
}

// Warm brand tones for the monthly charts (were rainbow colours).
const MONTHLY_PALETTE = ['#E8862C','#F6C453','#B45F1F','#E8A92C','#C98A12','#D2731F','#F2B544'];

const CHART_CONFIG = {
  pesanan:   { title: 'Pesanan',        unit: 'pesanan' },
  jualan:    { title: 'Jualan (RM)',    unit: 'RM', fmtFn: v => fmt(v) },
  cawan:     { title: 'Cawan Terjual',  unit: 'cawan' },
  pelanggan: { title: 'Pelanggan',      unit: 'pelanggan' },
};

/* Build the bar elements for one chart (shared by the dashboard grid and the zoom modal) */
function buildMonthlyBars(days, key, fmtFn){
  const max = Math.max(1, ...days.map(d => d[key]));
  return days.map(d => {
    const v = d[key];
    const h = Math.max(2, Math.round((v / max) * 100));
    const label = fmtFn ? fmtFn(v) : String(v);
    const color = MONTHLY_PALETTE[(d.day - 1) % MONTHLY_PALETTE.length];
    return `<div class="bar-col" title="Hari ${d.day}: ${label}">
      <div class="bar" style="height:${h}%; background:${color};"></div>
      <div class="bar-label">${d.day}</div>
    </div>`;
  }).join('');
}

function renderMonthlyReport(){
  const days = getMonthlyDailyStats();

  const buildChart = (key) => {
    const cfg = CHART_CONFIG[key];
    const bars = buildMonthlyBars(days, key, cfg.fmtFn);
    return `
      <div class="report-chart-block">
        <div class="report-chart-header">
          <div class="report-chart-title">${cfg.title}</div>
          <button class="chart-zoom-btn" data-chart="${key}" title="Besarkan & lihat butiran harian">⛶</button>
        </div>

  };

  const monthLabel = state.currentMonthKey || getMonthKey(new Date());

  return `
    <div class="monthly-report" id="monthlyReport">
      <div class="monthly-report-header">Laporan Bulanan Mengikut Hari &middot; ${monthLabel}</div>

/* Download the monthly daily breakdown as a CSV file (opens in Excel) */

  days.forEach(d => {

  });

/* Dynamically load an external script (used for PDF export libs) */
function loadExternalScript(src){
  return new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${src}"]`);
    if(existing){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Gagal memuatkan ' + src));
    document.head.appendChild(s);
  });
}

/* Convert a "#RRGGBB" hex color string to an [r,g,b] array for jsPDF. */
function hexToRgb_(hex){
  const h = hex.replace('#','');
  return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
}

/* Draw one bar chart natively on a jsPDF page (vector rectangles + text,
   not a screenshot) so it always renders sharp and fills the page
   exactly, regardless of on-screen scroll/zoom state. */
function drawChartPage_(pdf, days, key, cfg, monthLabel){
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const margin = 14;
  const fmtFn = cfg.fmtFn || (v => String(v));

  // Header
  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(16);
  pdf.setTextColor(43, 24, 16);
  pdf.text(`${cfg.title} Mengikut Hari`, margin, margin + 4);
  pdf.setFont('helvetica', 'normal');
  pdf.setFontSize(11);
  pdf.setTextColor(120, 100, 85);
  pdf.text(monthLabel, margin, margin + 11);

  // Chart plot area
  const chartTop = margin + 20;
  const chartBottom = pageHeight - margin - 22; // leave room for day labels + total box
  const chartHeight = chartBottom - chartTop;
  const chartLeft = margin;
  const chartRight = pageWidth - margin;
  const chartWidth = chartRight - chartLeft;

  const max = Math.max(1, ...days.map(d => d[key]));
  const n = days.length;
  const gap = 1.2;
  const barWidth = (chartWidth - gap * (n - 1)) / n;

  // baseline
  pdf.setDrawColor(43, 24, 16);
  pdf.setLineWidth(0.4);
  pdf.line(chartLeft, chartBottom, chartRight, chartBottom);

  pdf.setFontSize(7);
  days.forEach((d, i) => {
    const v = d[key];
    const h = max > 0 ? (v / max) * chartHeight : 0;
    const x = chartLeft + i * (barWidth + gap);
    const y = chartBottom - h;
    const [r,g,b] = hexToRgb_(MONTHLY_PALETTE[i % MONTHLY_PALETTE.length]);
    pdf.setFillColor(r, g, b);
    if(h > 0.5) pdf.rect(x, y, barWidth, h, 'F');

    // value label above the bar, only when the bar is tall enough and
    // the value is non-zero (keeps zero-days uncluttered)
    if(v > 0 && barWidth > 3){
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(6.5);
      pdf.setTextColor(60, 45, 35);
      const valueLabel = fmtFn(v);
      pdf.text(valueLabel, x + barWidth/2, Math.max(chartTop, y - 2), { align:'center' });
    }

    // day number below baseline
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(7);
    pdf.setTextColor(v > 0 ? 60 : 170, v > 0 ? 45 : 155, v > 0 ? 35 : 140);
    pdf.text(String(d.day), x + barWidth/2, chartBottom + 5, { align:'center' });
  });

  // Total box
  const total = days.reduce((s,d) => s + d[key], 0);
  const boxW = 70, boxH = 14;
  const boxX = pageWidth - margin - boxW;
  const boxY = pageHeight - margin - boxH + 8;
  pdf.setFillColor(255, 179, 67);
  pdf.setDrawColor(43, 24, 16);
  pdf.setLineWidth(0.5);
  pdf.roundedRect(boxX, boxY, boxW, boxH, 2, 2, 'FD');
  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(10);
  pdf.setTextColor(43, 24, 16);
  pdf.text('Jumlah Bulan Ini', boxX + 4, boxY + 6);
  pdf.setFontSize(12);
  pdf.text(`${fmtFn(total)} ${cfg.unit}`, boxX + 4, boxY + 11.5);
}

/* Build the monthly report PDF using native vector drawing (jsPDF rects
   + text) instead of screenshotting the on-screen DOM. This guarantees
   every chart prints sharp and fills its page fully, with all 30+ days
   visible (no scroll/crop), one chart per landscape page. */
async function exportMonthlyPdf(e){
  const btn = (e && e.currentTarget) ? e.currentTarget : null;
  const original = btn ? btn.textContent : '';
  try{
    if(btn){ btn.disabled = true; btn.textContent = 'Menjana PDF...'; }
    await loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');

    const days = getMonthlyDailyStats();
    const monthLabel = state.currentMonthKey || getMonthKey(new Date());
    const keys = ['pesanan', 'jualan', 'cawan', 'pelanggan'];

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('l', 'mm', 'a4');

    keys.forEach((key, i) => {
      if(i > 0) pdf.addPage();
      drawChartPage_(pdf, days, key, CHART_CONFIG[key], monthLabel);
    });

    pdf.save(`laporan-bulanan-${monthLabel}.pdf`);
  }catch(err){
    alert('Gagal jana PDF: ' + err.message);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = original; }
  }
}

/* ---------- Admin menu image upload (global - called from inline onchange) ---------- */
function handlePmenuUpload(input){
  const file = input.files[0];
  const itemId = input.dataset.itemId;
  if(!file || !itemId) return;

  const col = input.closest ? input.closest('.pmenu-item-col') : null;
  const saveBtn = col ? col.querySelector('.pmenu-save-btn') : null;
  const thumb = document.getElementById('pm_thumb_' + itemId);

  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = async function(){

      // ── Auto compress + square crop ──────────────────────────────
      // 1. Square-crop from centre (so image fills frame nicely)
      // 2. Resize to 300x300 (good for both admin thumb & customer card)
      // 3. JPEG quality 0.82 → ~30-60KB per image
      const SIZE = 300;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FBEFE0'; // cream background for transparent PNGs
      ctx.fillRect(0, 0, SIZE, SIZE);

      // Centre-crop: take the smaller dimension as crop size
      const sw = img.width, sh = img.height;
      const cropSize = Math.min(sw, sh);
      const sx = (sw - cropSize) / 2;
      const sy = (sh - cropSize) / 2;
      ctx.drawImage(img, sx, sy, cropSize, cropSize, 0, 0, SIZE, SIZE);

      const compressed = canvas.toDataURL('image/jpeg', 0.82);
      // ─────────────────────────────────────────────────────────────

      // Show preview immediately (local)
      menuImages[itemId] = compressed;
      if(thumb) thumb.src = compressed;
      // Also update customer menu view image if currently shown
      const custImg = document.querySelector('.photo img[alt="' + itemId + '"]');
      if(custImg) custImg.src = compressed;

      if(saveBtn){ saveBtn.innerHTML = '&#9711; Mengupload...'; saveBtn.disabled = true; }
      showToast('\u23F3 Mengupload gambar...', '');

      // Upload to Google Drive via GAS
      try{
        const result = await gasMenuSaveImage(itemId, compressed, 'image/jpeg');
        if(result && result.ok && result.imageUrl){
          // Convert to thumbnail URL for display (avoids CORS redirect issues)
          let displayUrl = result.imageUrl;
          const idMatch = displayUrl.match(/id=([a-zA-Z0-9_-]+)/);
          if(idMatch) displayUrl = 'https://drive.google.com/thumbnail?id=' + idMatch[1] + '&sz=w300';
          menuImages[itemId] = displayUrl;
          if(thumb) thumb.src = displayUrl;
          showToast('\u2705 Gambar berjaya disimpan!', 'success');
          if(state.view === 'menu') render(); // refresh menu view
        } else {
          const errMsg = (result && result.error) ? result.error : 'GAS belum update - semak deployment';
          console.error('GAS saveMenuImage:', errMsg);
          showToast('\u26A0\uFE0F ' + errMsg.substring(0, 70), 'error');
          // Gambar masih tersimpan dalam memori sesi ini
        }
      } catch(e){
        console.error('Upload error:', e);
        showToast('\u26A0\uFE0F Gambar preview OK, tapi gagal ke Drive', 'error');
      }
      if(saveBtn){ saveBtn.innerHTML = '&#128190; Simpan'; saveBtn.disabled = false; }
    };
    img.onerror = function(){ showToast('\u274C Gambar tidak sah', 'error'); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function savePmenuNamePrice(itemId){
  const nameEl = document.getElementById('pm_name_' + itemId);
  const priceEl = document.getElementById('pm_price_' + itemId);
  if(!nameEl || !priceEl){ showToast('\u274C Ralat: input tidak dijumpai', 'error'); return; }

  const newName = nameEl.value.trim();
  const newPrice = parseFloat(priceEl.value);
  if(!newName){ showToast('\u274C Nama tidak boleh kosong', 'error'); return; }
  if(isNaN(newPrice) || newPrice < 0){ showToast('\u274C Harga tidak sah', 'error'); return; }

  // 1. Update in-memory IMMEDIATELY (synchronous, no waiting)
  menuNames[itemId] = newName;
  menuPrices[itemId] = newPrice;
  const menuItem = MENU.find(m => m.id === itemId);
  if(menuItem){ menuItem.name = newName; menuItem.price = newPrice; }

  // 1c. If customer is currently viewing menu, refresh their view silently
  if(state.view === 'menu' || state.view === 'preview'){
    render();
  }

  // 1b. Persist to localStorage AND update in-memory override tracker
  try{
    const saved = JSON.parse(localStorage.getItem('kfedeSolMenuOverrides') || '{}');
    saved[itemId] = { name: newName, price: newPrice };
    localStorage.setItem('kfedeSolMenuOverrides', JSON.stringify(saved));
    _localMenuOverrides[itemId] = { name: newName, price: newPrice };
  }catch(e){}

  // 2. Show success UI immediately (no waiting for GAS)
  showToast('\u2705 Nama & harga berjaya disimpan!', 'success');
  const col = nameEl.closest('.pmenu-item-col');
  const btn = col ? col.querySelector('.pmenu-save-btn') : null;
  if(btn){
    btn.innerHTML = '\u2705 Tersimpan!';
    btn.style.background = '#2E7D32';
    btn.disabled = true;
    setTimeout(() => { btn.innerHTML = '&#128190; Simpan'; btn.style.background = ''; btn.disabled = false; }, 2000);
  }

  // 3. Fire-and-forget GAS save in background (dont await, dont block UI)
  gasPost('saveMenuMeta', { id: itemId, desc: getItemDesc({id:itemId}), name: newName, price: newPrice })
    .then(result => {
      if(!result || !result.ok) console.warn('saveMenuMeta GAS fail - data hanya tersimpan in-memory');
    }).catch(() => {});
}

function toggleMenuPublished(itemId){
  const item = MENU.find(m => m.id === itemId);
  if(!item) return;
  const published = !isItemPublished(item);
  menuPublished[itemId] = published;
  if(!published) state.cart[itemId] = 0;
  try{
    const saved = JSON.parse(localStorage.getItem('kfedeSolMenuPublished') || '{}');
    saved[itemId] = published;
    localStorage.setItem('kfedeSolMenuPublished', JSON.stringify(saved));
  }catch(e){}
  showToast(published ? '\u2705 Menu telah dipublish' : '\u26D4 Menu ditanda HABIS', published ? 'success' : 'error');
  render();
  gasPost('saveMenuMeta', { id:itemId, published:published })
    .then(result => { if(!result || !result.ok) console.warn('Status publish hanya tersimpan pada peranti ini'); })
    .catch(() => {});
}

/* Reject flow in our own dialogs: pick a reason from the list (or type one),
   then confirm. The browser's prompt()/confirm() boxes are unreliable on the
   admin tablet (they can be suppressed, which silently cancelled the reject).
   Resolves with the reason, or null when cancelled. */
function askRejectReason(order){
  const reasons = ['Kedai Dah Tutup', 'Stok Habis', 'Mesin Rosak', 'Terlalu Banyak Order', 'Lain-lain'];
  const label = order ? `${queueLabelOf(order)} · ${order.customerName || '-'}` : '';
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.innerHTML = `
      <div class="confirm-box danger reject-box">
        <h3 class="confirm-title">Sebab reject</h3>
        <p class="confirm-message">${escapeHtml(label)}</p>
        <div class="reject-reasons">
          ${reasons.map((r, i) => `<button type="button" class="reject-reason" data-reason="${escapeHtml(r)}">${escapeHtml(r)}</button>`).join('')}
        </div>
        <input type="text" class="reject-other" placeholder="Tulis sebab lain..." maxlength="80" hidden>
        <div class="confirm-actions">
          <button type="button" class="confirm-cancel">Batal</button>
          <button type="button" class="confirm-ok" disabled>Seterusnya</button>
        </div>
      </div>`;
    let chosen = '';
    const other = overlay.querySelector('.reject-other');
    const next = overlay.querySelector('.confirm-ok');
    const close = () => {
      document.removeEventListener('keydown', onKey);
      overlay.classList.add('closing');
      setTimeout(() => overlay.remove(), 180);
    };
    const cancel = () => { close(); resolve(null); };
    const onKey = e => { if(e.key === 'Escape') cancel(); };
    overlay.querySelectorAll('.reject-reason').forEach(btn => {
      btn.onclick = () => {
        chosen = btn.dataset.reason;
        overlay.querySelectorAll('.reject-reason').forEach(b => b.classList.toggle('selected', b === btn));
        other.hidden = chosen !== 'Lain-lain';
        if(!other.hidden) other.focus();
        next.disabled = false;
      };
    });
    overlay.querySelector('.confirm-cancel').onclick = cancel;
    overlay.onclick = e => { if(e.target === overlay) cancel(); };
    next.onclick = async () => {
      const reason = chosen === 'Lain-lain' ? (other.value.trim() || 'Lain-lain') : chosen;
      close();
      const sure = await confirmDialog({
        title: 'Sahkan reject?',
        message: `${label ? label + ' akan ditolak. ' : ''}Sebab: ${reason}`,
        confirmText: 'Ya, reject', cancelText: 'Tidak', danger: true
      });
      resolve(sure ? reason : null);
    };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
  });
}

function notifyOrderRejected(order){
  const reason = getRejectReason(order);
  showToast(`Pesanan No. ${String(order.queueNo).padStart(3,'0')} telah ditolak${reason ? ': ' + reason : ''}`, 'error');
  if(navigator.vibrate) navigator.vibrate([200,80,200]);
}

function dismissRejectedOrder(orderId){
  const timer = rejectedReturnTimers.get(orderId);
  if(timer) clearTimeout(timer);
  rejectedReturnTimers.delete(orderId);
  state.myOrderIds = (state.myOrderIds || []).filter(id => id !== orderId);
  state.myOrders = (state.myOrders || []).filter(o => o.id !== orderId);
  if(state.activeQueueId === orderId){
    const nextOrder = state.myOrders[0];
    state.activeQueueId = nextOrder ? nextOrder.id : null;
  }
  persistAppSession();
}

function scheduleRejectedOrderDismissal(orderId){
  if(!orderId || rejectedReturnTimers.has(orderId)) return;
  const timer = setTimeout(() => {
    dismissRejectedOrder(orderId);
    if(state.view === 'waiting'){
      state.view = state.myOrders.length > 0 ? 'waiting' : 'receipts';
    }
    render();
  }, 10000);
  rejectedReturnTimers.set(orderId, timer);
}

function bindViewEvents(){
  if(state.view === 'promo'){
    document.querySelectorAll('.promo-carousel-dot').forEach(dot=>{
      dot.onclick = () => {
        const index = Number(dot.dataset.promoSlide);
        if(!Number.isInteger(index) || index < 0 || index >= state.promoCarouselCount) return;
        state.promoSlideIndex = index;
        movePromoCarousel(index + 1, false);
        schedulePromoCarouselAdvance();
      };
    });
  }
  document.querySelectorAll('[data-auth-view]').forEach(tab=>{
    tab.onclick = () => {
      const next = tab.dataset.authView;
      if(next === state.view) return;
      state.regError = '';
      state.checkOrderError = '';
      state.adminLoginError = '';
      state.view = next;
      render();
    };
  });

  if(state.view === 'register'){
    const nameInput = document.getElementById('custName');
    const phoneInput = document.getElementById('custPhone');
    const submitBtn = document.getElementById('regSubmit');
    if(nameInput) nameInput.oninput = (e) => {
      const cleaned = e.target.value.replace(/[^a-zA-Z\s]/g, '');
      if(cleaned !== e.target.value) e.target.value = cleaned;
      state.regName = cleaned;
    };
    if(phoneInput) phoneInput.oninput = (e) => {
      const cleaned = e.target.value.replace(/[^0-9]/g, '');
      if(cleaned !== e.target.value) e.target.value = cleaned;
      state.regPhone = cleaned;
    };
    const genderInput = document.getElementById('custGender');
    if(genderInput) genderInput.onchange = () => { state.regGender = genderInput.value; };
    const birthdayInput = document.getElementById('custBirthday');
    if(birthdayInput) birthdayInput.onchange = () => { state.regBirthday = birthdayInput.value; };
    const refInput = document.getElementById('custRefCode');
    if(refInput) refInput.oninput = (e) => {
      const cleaned = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
      if(cleaned !== e.target.value) e.target.value = cleaned;
      state.regRefCode = cleaned;
    };
    if(submitBtn){
      submitBtn.onclick = () => {
        const name = (nameInput.value || '').trim();
        const phone = (phoneInput.value || '').trim();
        if(!name || !phone){
          state.regError = 'Sila isi nama dan no. telefon.';
          render();
          return;
        }
        if(phone.length < 9){
          state.regError = 'No. telefon mesti sekurang-kurangnya 9 digit.';
          render();
          return;
        }
        const refCode = (state.regRefCode || '').trim();
        if(refCode && !/^\d{6}$/.test(refCode)){
          state.regError = 'Kod kawan mesti 6 nombor.';
          render();
          return;
        }
        const profile = {};
        if(state.regGender) profile.gender = state.regGender;
        if(state.regBirthday) profile.birthday = state.regBirthday;
        state.regRefCode = '';
        state.regGender = '';
        state.regBirthday = '';
        state.customer = { name, phone };
        if(refCode) applyReferralCode(refCode);
        if(Object.keys(profile).length) saveProfile(profile, true);
        state.regError = '';
        state.view = 'promo';
        state.myLoyalty = undefined;
        state.myPoints = null;
        render();
        // v3.6.0: lepas scan QR & tekan Teruskan, terus minta izin notifikasi.
        // Mesti dalam klik yang sama (Chrome/iPhone sekat popup tanpa klik).
        if(pushSupported() && Notification.permission === 'default'){
          state.pushNudgeHidden = true;
          turnOnPush();
        }
      };
    }
    const checkLink = document.getElementById('checkOrderLink');
    if(checkLink){
      checkLink.onclick = () => {
        state.checkOrderError = '';
        state.view = 'check-order';
        render();
      };
    }
  }

  if(state.view === 'check-order'){
    const checkPhoneInput = document.getElementById('checkPhone');
    const checkSubmitBtn = document.getElementById('checkOrderSubmit');
    const backBtn = document.getElementById('backToRegister');
    if(checkPhoneInput) checkPhoneInput.oninput = (e) => {
      const cleaned = e.target.value.replace(/[^0-9]/g, '');
      if(cleaned !== e.target.value) e.target.value = cleaned;
      state.checkPhone = cleaned;
    };
    if(checkSubmitBtn){
      checkSubmitBtn.onclick = async () => {
        const phone = (checkPhoneInput.value || '').trim();
        if(!phone || phone.length < 9){
          state.checkOrderError = 'Sila masukkan no. telefon yang sah.';
          render();
          return;
        }
        checkSubmitBtn.disabled = true;
        checkSubmitBtn.textContent = 'Mencari...';
        const phoneOrders = await loadMyOrders({ phone });
        if(phoneOrders === null){
          state.checkOrderError = 'Sambungan ke server lambat. Sila cuba lagi.';
          checkSubmitBtn.disabled = false;
          checkSubmitBtn.textContent = 'Cari Pesanan';
          render();
          return;
        }
        const found = (phoneOrders || []).filter(o => String(o.customerPhone || '') === phone);
        if(found.length === 0){
          state.checkOrderError = 'Tiada pesanan dijumpai untuk no. telefon ini.';
          checkSubmitBtn.disabled = false;
          checkSubmitBtn.textContent = 'Cari Pesanan';
          render();
          return;
        }
        const custName = found[found.length - 1].customerName || '';
        state.customer = { name: custName, phone };
        const activeOrders = found.filter(o => {
          const status = orderStatus(o);
          return status !== 'selesai' && status !== 'rejected';
        });
        const receiptOrders = found.filter(o => {
          const status = orderStatus(o);
          return status === 'selesai' || status === 'rejected';
        });
        state.myReceipts = receiptOrders;
        state.checkOrderError = '';
        state.checkPhone = '';
        if(activeOrders.length > 0){
          state.myOrderIds = activeOrders.map(o => o.id);
          state.myOrders = activeOrders;
          state.activeQueueId = null;
          state.view = 'waiting';
        } else {
          // All matching orders are already 'selesai' - go straight to
          // receipts instead of flashing through an empty waiting page.
          state.view = 'receipts';
        }
        render();
      };
    }
    if(checkPhoneInput){
      checkPhoneInput.onkeydown = (e) => { if(e.key === 'Enter' && checkSubmitBtn) checkSubmitBtn.click(); };
    }
    if(backBtn){
      backBtn.onclick = () => {
        state.checkOrderError = '';
        state.view = 'register';
        render();
      };
    }
  }

  if(state.view === 'admin-login'){
    const userInput = document.getElementById('adminUsername');
    const pwInput = document.getElementById('adminPassword');
    const loginBtn = document.getElementById('adminLoginSubmit');
    if(loginBtn){
      loginBtn.onclick = async () => {
        const ctx = getAudioCtx();
        if(ctx && ctx.state === 'suspended') ctx.resume();
        const username = (userInput.value || '').trim();
        const pw = (pwInput.value || '').trim();
        if(!username || !pw){
          state.adminLoginError = 'Sila masukkan ID admin dan kata laluan.';
          render();
          return;
        }
        loginBtn.disabled = true;
        loginBtn.textContent = 'Menyemak...';
        showAdminLoginLoader();
        const result = await adminLoginApi(username, pw);
        if(result === null){
          await hideAdminLoginLoader(false);
          state.adminLoginError = 'Server sedang lambat. Sila tunggu sebentar dan cuba semula.';
          render();
          return;
        }
        if(!result.ok || !result.admin || !result.token){
          await hideAdminLoginLoader(false);

function startAdminClock(){
  if(clockTimer) clearInterval(clockTimer);
  const update = () => {
    const el = document.getElementById('adminClock');
