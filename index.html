.menu-cat-tabs-wrap{ position:relative; padding:6px 18px 12px; }
.menu-cat-tabs{
  display:flex; gap:8px; overflow-x:auto;
  -ms-overflow-style:none; scrollbar-width:none;
  scroll-snap-type:x mandatory; scroll-behavior:smooth;
}
.menu-cat-tabs::-webkit-scrollbar{ display:none; }
.menu-cat-tab{
  flex:0 0 calc(50% - 4px); scroll-snap-align:start;
  background:var(--card); border:1px solid #EFE2D2; border-radius:20px;
  padding:9px 12px; font-size:13px; font-weight:600; color:var(--text-soft);
  cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  text-align:center; font-family:'Work Sans',sans-serif;
  transition:background 0.15s, color 0.15s, border-color 0.15s;
}
.menu-cat-tab.active{ background:var(--sol-orange); color:#fff; border-color:var(--sol-orange); }
.cat-arrow{
  position:absolute; top:6px; bottom:12px; width:28px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(to right, transparent, var(--cream) 70%);
  border:none; color:var(--coffee-mid); font-size:20px; font-weight:700;
  cursor:pointer; z-index:2;
}
.cat-arrow.left{ left:18px; background:linear-gradient(to left, transparent, var(--cream) 70%); justify-content:flex-start; }
.cat-arrow.right{ right:18px; justify-content:flex-end; }
.cat-arrow.hidden{ display:none; }
.popular-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
.popular-card{
  position:relative; background:var(--card); border:1px solid #EFE2D2;
  border-radius:16px; overflow:hidden;
}
.popular-card .photo{ width:100%; aspect-ratio:1/1; overflow:hidden; }
.popular-card .photo img{ width:100%; height:100%; object-fit:cover; cursor:pointer; display:block; }
.popular-card .info{ padding:10px 40px 12px 12px; }
.popular-card .name{ font-weight:500; font-size:13px; color:var(--coffee-dark); }
.popular-card .price{ font-family:'Space Mono', monospace; font-size:12px; color:var(--text-soft); margin-top:3px; }
.popular-plus{
  position:absolute; right:10px; bottom:10px;
  width:34px; height:34px; border-radius:50%;
  background:#2587D8; color:#fff; border:none; font-size:18px; font-weight:700;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,0.18);
}
.popular-plus:active{ transform:scale(0.92); }

/* ---------- Lightbox ---------- */
.menu-card .photo img{ cursor:pointer; }
.lightbox-overlay{
  position:fixed; inset:0; background:rgba(43,24,16,0.92);
  display:flex; align-items:center; justify-content:center;
  z-index:1000; padding:10px;
}
.lightbox-overlay img{
  width:100%; max-width:600px;
  max-height:92vh;
  border-radius:16px; display:block;
  object-fit:contain;
}
.lightbox-close{
  position:absolute; top:18px; right:18px;
  width:38px; height:38px; border-radius:50%;
  background:rgba(251,243,231,0.92); border:none;
  color:var(--coffee-dark); font-size:20px; line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}

/* ---------- Submit overlay ---------- */
.submit-overlay{
  position:fixed; inset:0; background:rgba(251,243,231,0.92);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; z-index:1000;
}
.submit-overlay-text{
  font-family:'Fraunces', serif; font-weight:600; font-size:17px; color:var(--coffee-dark);
}

/* ---------- Cart bar extra ---------- */
.cart-bar .outline-btn{
  flex:0 0 auto;
  background:transparent; border:1px solid var(--sol-gold); color:var(--sol-gold);
  padding:13px 18px; border-radius:30px; font-weight:600; font-size:13px;
  cursor:pointer; font-family:'Work Sans',sans-serif;
}
.cart-bar.preview-cart-bar .outline-btn{ border-color:var(--coffee-mid); color:var(--coffee-mid); }
.cart-bar #submitOrder{ flex:1; }

/* ---------- Squares loader ---------- */
.squares-loader{
  display:flex; gap:12px; justify-content:center; align-items:center; height:60px;
}
.squares-loader .sq{
  width:18px; height:18px; border-radius:5px;
  background:var(--sol-orange);
  animation: sq-bounce 1.1s ease-in-out infinite;
}
.squares-loader .sq:nth-child(1){ animation-delay:0s; }
.squares-loader .sq:nth-child(2){ animation-delay:0.12s; }
.squares-loader .sq:nth-child(3){ animation-delay:0.24s; }
.squares-loader .sq:nth-child(4){ animation-delay:0.36s; }
.squares-loader .sq:nth-child(5){ animation-delay:0.48s; }
@keyframes sq-bounce{
  0%,100%{ transform:scale(1) rotate(0deg); background-color:var(--sol-orange); border-radius:5px; }
  50%{ transform:scale(1.7) rotate(45deg); background-color:var(--sol-gold); border-radius:50%; }
}
.squares-loader.ready .sq{
  animation:none; background-color:var(--sage); transform:scale(1); border-radius:5px;
}

/* ---------- Prep box ---------- */
.prep-box{
  width:100%; text-align:center;
  background:#FCE9A8; color:#7A5D0A; font-weight:600; font-size:14px;
  padding:12px 16px; border-radius:12px;
  animation: blink-yellow 1.2s ease-in-out infinite;
}
.prep-box.big{
  font-size:18px; padding:20px 20px;
}
.prep-box.ready{
  background:#EAF1EC; color:var(--sage-dark);
  animation:none;
}
.prep-box.rejected{ background:#FDE2E2; color:#A50F0F; border:2px solid #C62828; animation:none; }
.squares-loader.rejected .sq{ animation:none; background-color:#C62828; transform:scale(1); border-radius:5px; }
@keyframes blink-yellow{
  0%,100%{ opacity:1; }
  50%{ opacity:0.35; }
}
@media (max-width:520px){
  .order-roadmap{ padding:0; }
  .road-step{ font-size:10px; line-height:1.25; }
  .road-dot{ width:30px; height:30px; }
  .road-step:not(:last-child)::after{ top:13px; left:calc(50% + 15px); right:calc(-50% + 15px); }
}
@media (prefers-reduced-motion:reduce){
  .road-step.active .road-dot,.ready-counter-visual{ animation:none !important; }
}

/* ---------- Hot / Ice toggle ---------- */
.temp-toggle{
  display:flex; gap:0; flex-shrink:0; border-radius:20px;
  overflow:hidden; border:1.5px solid var(--sol-orange);
}
.temp-btn{
  padding:5px 11px; font-size:11px; font-weight:700;
  border:none; background:transparent; color:var(--sol-orange);
  cursor:pointer; line-height:1; font-family:'Work Sans',sans-serif;
  letter-spacing:0.5px; transition:background 0.15s, color 0.15s;
}
.temp-btn.active{ background:var(--sol-orange); color:#fff; }
.temp-btn[data-temp="hot"].active{ background:#8F1D2C; border-color:#8F1D2C; color:#fff; }
.temp-btn[data-temp="ice"].active{ background:#153E75; border-color:#153E75; color:#fff; }
.temp-btn:first-child{ border-right:1px solid var(--sol-orange); }

/* ---------- Pengurusan Menu Admin (redesign) ---------- */
.pmenu-wrap{ padding:20px 22px; }
.pmenu-wrap h2{
  font-family:'Fraunces',serif; font-weight:600; font-size:22px;
  margin-bottom:4px;
}
.pmenu-wrap .sub{ color:var(--text-soft); font-size:14px; margin-bottom:18px; }
.pmenu-section-box{
  background:var(--card); border:2px solid var(--coffee-dark);
  border-radius:14px; margin-bottom:18px; overflow:hidden;
}
.pmenu-section-header{
  background:#FFB343; border-bottom:2px solid var(--coffee-dark);
  padding:12px 18px;
  font-family:'Fraunces',serif; font-weight:700; font-size:15px;
  color:var(--coffee-dark); letter-spacing:0.5px;
}
.pmenu-items-row{
  display:flex; flex-direction:row; overflow-x:auto;
  gap:0; padding:0;
}
.pmenu-item-col{
  flex:0 0 220px; border-right:1px solid #EFE2D2;
  padding:16px 18px; display:flex; flex-direction:column; gap:8px;
}
.pmenu-item-col:last-child{ border-right:none; }
.pmenu-item-name{ font-weight:600; font-size:13px; color:var(--coffee-dark); }
.pmenu-item-price{ font-family:'Space Mono',monospace; font-size:11px; color:var(--text-soft); }
.pmenu-img-upload{
  width:100%; height:100px; border-radius:10px; overflow:hidden;
  background:#FBEFE0; display:flex; align-items:center; justify-content:center;
  cursor:pointer; border:2px dashed #EFE2D2; transition:border-color 0.2s;
  position:relative; text-align:center; user-select:none;
}
.pmenu-img-upload:hover{ border-color:var(--sol-orange); background:#FDE9D0; }
.pmenu-img-upload:active{ background:#F5D5B0; }
.pmenu-img-upload img{ width:100%; height:100%; object-fit:contain; border-radius:8px; pointer-events:none; }
.pmenu-img-upload .upload-hint{
  position:absolute; bottom:0; left:0; right:0; text-align:center;
  font-size:10px; font-weight:600; color:#fff; background:rgba(43,24,16,0.55);

}
.pmenu-desc-area{

}
.pmenu-desc-area:focus{ outline:2px solid var(--sol-orange); }
.pmenu-save-btn{
  background:var(--sol-orange); color:#fff; border:none;

@media (hover:hover){ .pmenu-save-btn:hover{ background:#D2731F; } }
.pmenu-save-btn:active{ transform:scale(.97); }
.pmenu-publish-btn{width:100%;margin-top:7px;padding:9px 10px;border:1px solid #2e7d32;border-radius:20px;background:#eaf7ed;color:#23672b;font:700 12px 'Work Sans',sans-serif;cursor:pointer}.pmenu-publish-btn.unpublished{border-color:#a43b32;background:#f8e7e4;color:#93372f}.pmenu-publish-btn:hover{filter:brightness(.96)}
.pmenu-file-input{ display:none; }

/* ---------- Toast Notification ---------- */
.toast-container{
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  z-index:9999; display:flex; flex-direction:column; gap:8px;
  pointer-events:none; min-width:220px; max-width:340px;
}
.toast{
  background:var(--coffee-dark); color:var(--cream);
  padding:12px 20px; border-radius:12px;
  font-family:'Work Sans',sans-serif; font-size:14px; font-weight:500;
  text-align:center; box-shadow:0 4px 20px rgba(43,24,16,0.35);
  animation: toast-in 0.3s ease, toast-out 0.3s ease 2.2s forwards;
}
/* animated confirm dialog */
.confirm-overlay{ position:fixed; inset:0; z-index:10000; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(28,15,9,.55); backdrop-filter:blur(3px); animation:confirm-fade .2s ease both; }
.confirm-overlay.closing{ animation:confirm-fade-out .18s ease both; }
.confirm-box{ width:min(100%,360px); padding:24px 20px 18px; text-align:center; background:#FFFDF8; border-radius:20px; box-shadow:0 18px 50px rgba(28,15,9,.35); animation:confirm-pop .32s cubic-bezier(.2,1.4,.4,1) both; font-family:'Work Sans',sans-serif; }
.confirm-overlay.closing .confirm-box{ animation:confirm-pop-out .18s ease both; }
.confirm-icon{ width:62px; height:62px; margin:0 auto 12px; border-radius:50%; display:flex; align-items:center; justify-content:center; font:900 34px 'Fraunces',serif; color:#fff; background:var(--sol-orange); animation:confirm-wiggle .6s ease .25s both; }
.confirm-box.danger .confirm-icon{ background:#C62828; box-shadow:0 0 0 8px rgba(198,40,40,.12); }
.confirm-title{ margin:0 0 8px; font-family:'Fraunces',serif; font-size:21px; color:var(--coffee-dark); }
.confirm-message{ margin:0 0 18px; font-size:14px; line-height:1.5; color:var(--coffee-mid); white-space:pre-line; }
.reject-box{ text-align:left; }
.reject-box .confirm-title, .reject-box .confirm-message{ text-align:center; }
.reject-reasons{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
.reject-reason{ min-height:46px; padding:10px 14px; border:2px solid #EADCC8; border-radius:12px; background:#FFFEFB; color:var(--coffee-dark); font:600 15px 'Work Sans',sans-serif; text-align:left; cursor:pointer; transition:border-color .15s, background .15s; }
.reject-reason.selected{ border-color:#C62828; background:#FBE3E1; color:#8E1B1B; }
.reject-other{ width:100%; min-height:46px; margin-bottom:14px; padding:10px 14px; border:2px solid #EADCC8; border-radius:12px; font:500 15px 'Work Sans',sans-serif; color:var(--coffee-dark); background:#fff; }
.reject-other:focus{ outline:none; border-color:#C62828; }
.confirm-ok:disabled{ opacity:.45; cursor:not-allowed; }
.confirm-actions{ display:flex; gap:10px; }
.confirm-actions button{ flex:1; min-height:46px; border:0; border-radius:12px; font:700 15px 'Work Sans',sans-serif; cursor:pointer; transition:transform .12s, background .2s; }
.confirm-actions button:active{ transform:scale(.96); }
.confirm-cancel{ background:#EFE4D6; color:var(--coffee-dark); }
.confirm-cancel:hover{ background:#E4D5C2; }
.confirm-ok{ background:var(--sol-orange); color:#fff; }
.confirm-box.danger .confirm-ok{ background:#C62828; }
.confirm-box.danger .confirm-ok:hover{ background:#8E1B1B; }
@keyframes confirm-fade{ from{ opacity:0; } to{ opacity:1; } }
@keyframes confirm-fade-out{ to{ opacity:0; } }
@keyframes confirm-pop{ from{ opacity:0; transform:scale(.7) translateY(20px); } to{ opacity:1; transform:none; } }
@keyframes confirm-pop-out{ to{ opacity:0; transform:scale(.9); } }
@keyframes confirm-wiggle{ 0%,100%{ transform:rotate(0); } 20%{ transform:rotate(-14deg); } 40%{ transform:rotate(12deg); } 60%{ transform:rotate(-8deg); } 80%{ transform:rotate(5deg); } }
@media (prefers-reduced-motion: reduce){ .confirm-overlay, .confirm-box, .confirm-icon{ animation:none !important; } }
.toast.success{ background:#2E7D32; }
.toast.error{ background:#C62828; }
@keyframes toast-in{
  from{ opacity:0; transform:translateY(-20px); }
  to{ opacity:1; transform:translateY(0); }
}
@keyframes toast-out{
  from{ opacity:1; transform:translateY(0); }
  to{ opacity:0; transform:translateY(-20px); }
}

/* ---------- Admin login loading overlay ---------- */
.admin-login-loader{
  position:fixed; inset:0; z-index:2500;

}

.admin-login-loader-title{
  font-family:'Space Mono',monospace; font-size:clamp(22px,7vw,34px);
  font-weight:700; letter-spacing:2px; margin-bottom:22px;

}
.admin-login-loader-row{
  display:flex; justify-content:space-between; gap:16px; margin-bottom:8px;
  font-family:'Space Mono',monospace; font-size:13px; font-weight:700;
}
.admin-login-loader-track{
  height:28px; padding:4px; border:3px solid #FFF8EA; border-radius:3px;
  box-shadow:4px 4px 0 #7A2B17; overflow:hidden;
}

function versionAtLeast(have, need){
  const a = String(have || '0').replace(/^v/, '').split(/[.-]/).map(Number);
  const b = String(need || '0').replace(/^v/, '').split(/[.-]/).map(Number);
  for(let i = 0; i < 3; i++){
    if((a[i] || 0) > (b[i] || 0)) return true;
    if((a[i] || 0) < (b[i] || 0)) return false;
  }
  return true;
}

// Since v3.3.4 redeeming keeps the cups and logs the time in c.redeems, so the
// free drinks still to collect are the ones earned minus the ones redeemed.
function freeDrinksEarned(c){ return Math.floor((Number(c && c.qty) || 0) / FREE_DRINKS_THRESHOLD); }
function freeDrinksAvailable(c){ return Math.max(0, freeDrinksEarned(c) - ((c && c.redeems) || []).length); }

/* Restore the current page/session after a browser refresh. */
try{
  const saved = JSON.parse(sessionStorage.getItem('kfedeSolAppSession') || 'null');
  const allowedViews = ['register','check-order','menu','item-detail','preview','waiting','promo','rewards','location','account','receipts','admin-login','admin'];
  if(saved && allowedViews.includes(saved.view)){
    state.view = saved.view;
    state.customer = saved.customer || null;
    state.cart = saved.cart || {};
    state.itemTemp = saved.itemTemp || {};
    state.myOrderIds = saved.myOrderIds || [];
    state.myReceipts = saved.myReceipts || [];
    state.loggedInAdmin = saved.loggedInAdmin || null;
    state.adminSessionToken = saved.adminSessionToken || null;
    if(state.view === 'admin' && (!state.loggedInAdmin || !state.adminSessionToken)) state.view = 'admin-login';
  }
}catch(e){ console.warn('Session restore skipped', e); }

/* Admin login survives refresh/browser restart until the server-side TTL
   expires. This is kept separately from the customer session. */
if(!state.loggedInAdmin || !state.adminSessionToken){
  try{
    const durableAdmin = JSON.parse(localStorage.getItem('kfedeSolAdminSession') || 'null');
    if(durableAdmin && durableAdmin.admin && durableAdmin.token){
      state.loggedInAdmin = durableAdmin.admin;
      state.adminSessionToken = durableAdmin.token;
      // A device that is still logged in as admin reopens in the admin panel,
      // also after the app was closed (Back button, tablet restart).
      if(state.view === 'admin-login' || state.view === 'splash') state.view = 'admin';
    }
  }catch(e){ console.warn('Admin restore skipped', e); }
}

/* Customer stays signed in and keeps receipts until explicit logout. */
if(!state.customer){
  try{
    const durable = JSON.parse(localStorage.getItem('kfedeSolCustomerSession') || 'null');
    if(durable && durable.customer){
      state.customer = durable.customer;
      state.myOrderIds = durable.myOrderIds || [];
      state.myReceipts = durable.myReceipts || [];
      state.cart = durable.cart || {};
      state.itemTemp = durable.itemTemp || {};
      state.view = state.myOrderIds.length ? 'waiting' : 'promo';
    }
  }catch(e){ console.warn('Customer restore skipped', e); }
}

function persistAppSession(){
  try{
    sessionStorage.setItem('kfedeSolAppSession', JSON.stringify({
      view:state.view, customer:state.customer || null, cart:state.cart || {}, itemTemp:state.itemTemp || {},

// Malaysian numbers are stored as typed (012-345 6789, +6012..., 6012...);
// wa.me needs digits with the country code and no leading zero.
function whatsappNumber(phone){
  let d = String(phone || '').replace(/\D/g, '');
  if(d.startsWith('0')) d = '6' + d;
  else if(d.startsWith('1')) d = '60' + d;
  return /^601\d{8,9}$/.test(d) ? d : '';
}

/* Used by: customer renderReceipts(), admin Pesanan "Resit" modal.
   Renders a single order as a printable shop receipt (logo, item list, total, queue no, date/time). */
function buildReceiptHtml(order){
  const dateTimeStr = new Date(order.createdAt).toLocaleString('ms-MY', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
  const rejected = isOrderRejected(order);
  const rejectReason = getRejectReason(order);
  const itemsHtml = (order.items||[]).map(i =>
    `<div class="shop-receipt-row"><span>${i.name} x${i.qty}</span><span>${fmt(i.price*i.qty)}</span></div>`
  ).join('');
  return `
    <div class="shop-receipt">
      <div class="shop-receipt-logo"><img src="${LOGO_URL}" alt="K'fe De Sol"></div>
      <div class="shop-receipt-shopname">K'fe De Sol</div>
      <div class="shop-receipt-tagline">${rejected ? 'Rekod Pesanan Ditolak' : 'Resit Rasmi'}</div>
      <div class="shop-receipt-divider"></div>
      <div class="shop-receipt-meta">
        <div class="shop-receipt-row"><span>No. Giliran</span><span>${String(order.queueNo).padStart(3,'0')}</span></div>
        <div class="shop-receipt-row"><span>Tarikh/Masa</span><span>${dateTimeStr}</span></div>
        ${order.customerName ? `<div class="shop-receipt-row"><span>Nama</span><span>${order.customerName}</span></div>` : ''}
        ${order.customerPhone ? `<div class="shop-receipt-row"><span>No. Hp</span><span>${order.customerPhone}</span></div>` : ''}
        ${rejected ? `<div class="shop-receipt-row"><span>Status</span><span>DITOLAK</span></div>` : ''}
        ${rejected ? `<div class="shop-receipt-row"><span>Sebab</span><span>${rejectReason || 'Lain-lain'}</span></div>` : ''}
      </div>
      <div class="shop-receipt-divider"></div>
      <div class="shop-receipt-items">${itemsHtml}</div>
      <div class="shop-receipt-divider"></div>
      <div class="shop-receipt-row shop-receipt-total"><span>Jumlah</span><span>${fmt(order.total)}</span></div>
      <div class="shop-receipt-divider"></div>
      <div class="shop-receipt-thanks">${rejected ? 'Pesanan ini tidak dikira sebagai jualan.' : 'Terima kasih atas sokongan anda &#9749;'}</div>
    </div>
  `;
}

function printReceiptOrder(order){
  const html = buildReceiptHtml(order);
  const win = window.open('', '_blank', 'width=420,height=600');
  if(!win){ alert('Sila benarkan pop-up untuk mencetak resit.'); return; }
  win.document.write(`
    <html>
      <head>
        <title>Resit - No. ${String(order.queueNo).padStart(3,'0')}</title>
        <style>
          @page{ size:80mm auto; margin:5mm; }
          @media print{ html, body{ width:80mm; } }
          body{ font-family:'Courier New', monospace; margin:0; padding:20px; background:#fff; }
          .shop-receipt{ background:#fff; color:#1a1a1a; width:320px; max-width:100%; margin:0 auto; padding:0; }
          .shop-receipt-logo{ display:flex; justify-content:center; margin-bottom:8px; }
          .shop-receipt-logo img{ width:64px; height:64px; border-radius:50%; }
          .shop-receipt-shopname{ text-align:center; font-weight:800; font-size:18px; letter-spacing:1px; }
          .shop-receipt-tagline{ text-align:center; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#666; margin-bottom:4px; }
          .shop-receipt-divider{ border-top:1px dashed #999; margin:10px 0; }
          .shop-receipt-row{ display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:2px 0; }
          .shop-receipt-meta .shop-receipt-row span:first-child{ color:#555; }
          .shop-receipt-total{ font-weight:700; font-size:15px; }
          .shop-receipt-thanks{ text-align:center; font-size:11px; color:#666; margin-top:6px; }
        </style>
      </head>
      <body>${html}</body>
    </html>
  `);
  win.document.close();
  win.onafterprint = () => { win.close(); };
  win.focus();
  setTimeout(() => {
    win.print();
    // Fallback: some browsers don't fire onafterprint reliably, so close
    // the popup shortly after the print dialog would have appeared/closed.
    setTimeout(() => { if(!win.closed){ win.close(); } }, 1000);
  }, 300);
}

    const qs = new URLSearchParams(Object.assign({ action, _ts: Date.now() }, auth, params || {})).toString();
    const res = await fetch(`${GAS_URL}?${qs}`, { cache: 'no-store', signal:controller.signal });
    return await res.json();
  }catch(e){ console.error('gas GET failed', action, e); return null; }
  finally{ clearTimeout(timeoutId); }
}
async function gasPost(action, body, timeoutMs){
  if(GAS_URL.indexOf('PASTE_YOUR') === 0) return null;
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), timeoutMs || 30000);
  try{
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      signal: controller.signal,
      body: JSON.stringify(Object.assign({ action }, body || {},
        state.loggedInAdmin && state.adminSessionToken ? {
          adminId:state.loggedInAdmin.id, authToken:state.adminSessionToken
        } : {}))
    });
    const data = await res.json();
    if(data && data.error) console.error('gas backend error', action, data.error, data.stack || '');
    return data;
  }catch(e){ console.error('gas POST failed', action, e); return null; }
  finally{ clearTimeout(timeoutId); }
}

/* ---------- push notification (v3.4.0) ----------
   Telefon pelanggan terima notifikasi walaupun app ditutup: pesanan siap,
   mata ganjaran, promosi. Langganan disimpan di servis Cloudflare
   (kfe-de-sol-push), dikenal pasti dengan no. telefon; Apps Script hantar
   notifikasi bila admin tukar status. sw.js = push sahaja, tiada cache. */
function pushPhone(phone){ return String(phone || '').replace(/\D/g, ''); }
function pushSupported(){
  return !!PUSH_URL && !!VAPID_PUBLIC && 'serviceWorker' in navigator && 'PushManager' in window && typeof Notification !== 'undefined';
}
// iPhone/iPad: push hanya jalan bila app dibuka dari ikon Home Screen
function pushIsIos(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function pushIsStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function pushKeyBytes(s){ return Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0)); }
function pushPost(path, body){
  return fetch(PUSH_URL + path, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) }).then(r => r.json());
}
async function pushRegistration(){
  return (await navigator.serviceWorker.getRegistration('/')) || navigator.serviceWorker.register('/sw.js', { scope:'/' });
}
// 'unsupported' | 'ios' (perlu Home Screen) | 'blocked' | 'off' | 'on'
async function pushStatus(){
  if(!pushSupported()) return pushIsIos() && !pushIsStandalone() && PUSH_URL ? 'ios' : 'unsupported';
  if(Notification.permission === 'denied') return 'blocked';
  try{
    const reg = await navigator.serviceWorker.getRegistration('/');
    const sub = reg && await reg.pushManager.getSubscription();
    return sub && Notification.permission === 'granted' ? 'on' : 'off';
  }catch(e){ return 'off'; }
}
// Minta izin -> langganan browser. Pulangkan langganan, atau 'blocked' / 'off'.
// Dikongsi oleh notifikasi pelanggan dan notifikasi order baru admin.
async function pushDeviceSubscription(){
  const perm = await Notification.requestPermission();
  if(perm !== 'granted') return perm === 'denied' ? 'blocked' : 'off';
  const reg = await pushRegistration();
  // v3.7.1: iPhone kali pertama dibuka dari Home Screen boleh lambat menyiapkan
  // sw.js; jangan tunggu selama-lamanya. Gagal di sini = cuba lagi bila app dibuka.
  if(!reg.active) await Promise.race([
    navigator.serviceWorker.ready,
    new Promise((_, reject) => setTimeout(() => reject(new Error('SW_TIMEOUT')), 15000))
  ]);
  return (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:pushKeyBytes(VAPID_PUBLIC) }));
}
// Hidupkan: minta izin -> langgan -> hantar ke servis push
async function enablePush(phone){
  if(!pushSupported()) return 'unsupported';
  const sub = await pushDeviceSubscription();
  if(typeof sub === 'string') return sub;
  const r = await pushPost('/subscribe', { phone:pushPhone(phone), subscription:sub.toJSON() });
  if(!r.ok) throw new Error(r.error || 'SUBSCRIBE');
  try{ localStorage.setItem('kfedeSolPushRefreshed', pushPhone(phone) + '|' + Date.now()); }catch(e){}
  return 'on';
}
async function disablePush(phone){
  try{
    const reg = await navigator.serviceWorker.getRegistration('/');
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub){
      await pushPost('/unsubscribe', { phone:pushPhone(phone), endpoint:sub.endpoint }).catch(()=>{});
      // Telefon admin guna langganan browser yang sama: jangan putuskan
      if(!adminPushPref()) await sub.unsubscribe().catch(()=>{});
    }
  }catch(e){}
  try{ localStorage.removeItem('kfedeSolPushRefreshed'); }catch(e){}
  return 'off';
}

/* ---------- v3.8.0: notifikasi order baru di telefon admin ----------
   Tetapan peranti (Waktu Operasi dan Tambahan > Peranti). Langganan didaftar
   melalui Apps Script (perlu login admin), disimpan di Worker berasingan
   daripada pelanggan. Pilihan "ulang": Apps Script hantar semula setiap minit
   selagi ada order belum di-Acknowledge. */
const ADMIN_PUSH_KEY = 'kfedeSolAdminPush'; // '' | 'once' | 'repeat'
const ADMIN_PUSH_REFRESHED_KEY = 'kfedeSolAdminPushRefreshed';
function adminPushPref(){ try{ return localStorage.getItem(ADMIN_PUSH_KEY) || ''; }catch(e){ return ''; } }

    if(v) localStorage.setItem(ADMIN_PUSH_KEY, v);

  }catch(e){}
}
async function adminPushEndpoint(){

  }catch(e){ return ''; }
}
// 'unsupported' | 'ios' | 'blocked' | 'off' | 'on'
async function adminPushStatus(){

async function refreshPush(phone){

  try{ last = localStorage.getItem('kfedeSolPushRefreshed') || ''; }catch(e){}

  if(lastPhone === pushPhone(phone) && Date.now() - Number(lastAt || 0) < 24 * 60 * 60 * 1000) return;

    const sub = await reg.pushManager.getSubscription();

      if(r && r.ok) localStorage.setItem('kfedeSolPushRefreshed', pushPhone(phone) + '|' + Date.now());

  }catch(e){ /* abaikan - cuba lagi bila app dibuka semula */ }
}

/* ---------- operating hours ----------
   Regular hours are set by the admin (Admin tab > Waktu Operasi) and stored on
   the server; the same rules run in the Apps Script backend. The list has one
   entry per day, index 0 = Sunday ... 6 = Saturday: {open, close, closed}.
   Times are Malaysia time whatever the device timezone. Admin extra-hours
   slots open the shop outside these hours; a holiday (Tarikh Cuti) overrides
   both. */
const SHOP_TZ = 'Asia/Kuala_Lumpur';
const DAY_NAMES = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0]; // shown Monday first
function defaultShopHours(){
  return DAY_NAMES.map((_, day) => ({ open: day === 5 ? '15:00' : '11:00', close: '18:00', closed: false }));
}
// A clean 7-day list; anything malformed falls back to that day's default.
function normalizeShopHours(raw){
  const defaults = defaultShopHours();
  if(!Array.isArray(raw) || raw.length !== 7) return defaults;
  const isTime = v => /^([01]\d|2[0-3]):[0-5]\d$/.test(String(v));
  return raw.map((d, i) => (!d || !isTime(d.open) || !isTime(d.close) || d.open === d.close)
    ? defaults[i] : { open: String(d.open), close: String(d.close), closed: d.closed === true });
}
function shopHours(){ return state.shopHours || defaultShopHours(); }
// Regular hours only. A day that closes at or before it opens runs past
// midnight, so the early hours of the next day still belong to it.
function regularHoursOpen(hours, day, time){
  const today = hours[day];
  if(!today.closed){
    if(today.close > today.open){ if(time >= today.open && time < today.close) return true; }
    else if(time >= today.open) return true;
  }
  const yesterday = hours[(day + 6) % 7];
  return !yesterday.closed && yesterday.close <= yesterday.open && time < yesterday.close;
}
// "15:00" -> "3.00 petang"
function formatHour(time){
  const [hh, mm] = String(time).split(':').map(Number);
  const part = hh < 12 ? 'pagi' : hh < 14 ? 'tengah hari' : hh < 19 ? 'petang' : 'malam';
  return `${hh % 12 === 0 ? 12 : hh % 12}.${String(mm).padStart(2, '0')} ${part}`;
}
function formatHoursRange(d){
  return d.closed ? 'Tutup' : `${formatHour(d.open)} – ${formatHour(d.close)}${d.close <= d.open ? ' (esok)' : ''}`;
}
// Groups neighbouring days that share the same hours, Monday first, joining
// across the weekend: [{ label:'Sabtu – Khamis', text:'11.00 pagi – 6.00 petang', closed:false }, ...]
function summarizeShopHours(hours){
  const groups = [];
  WEEK_ORDER.forEach(day => {
    const text = formatHoursRange(hours[day]);
    const last = groups[groups.length - 1];
    if(last && last.text === text) last.days.push(day);
    else groups.push({ text, closed: hours[day].closed, days: [day] });
  });
  if(groups.length > 1 && groups[0].text === groups[groups.length - 1].text){
    const tail = groups.pop();
    groups[0].days = tail.days.concat(groups[0].days);
  }
  return groups.map(g => ({
    text: g.text, closed: g.closed,
    label: g.days.length === 7 ? 'Setiap hari'
      : g.days.length === 1 ? DAY_NAMES[g.days[0]]
      : `${DAY_NAMES[g.days[0]]} – ${DAY_NAMES[g.days[g.days.length - 1]]}`
  }));
}

function shopNow(){
  const parts = {};
  new Intl.DateTimeFormat('en-CA', {timeZone:SHOP_TZ, year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', weekday:'short', hourCycle:'h23'})
    .formatToParts(new Date()).forEach(p => { parts[p.type] = p.value; });
  const day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(parts.weekday);
  return { date:`${parts.year}-${parts.month}-${parts.day}`, time:`${parts.hour}:${parts.minute}`, day: day < 0 ? 0 : day };
}

function nextDateStr(date){
  const d = new Date(date + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + 1);
  return d.toISOString().slice(0,10);
}

// An extra-hours slot whose end is not after its start runs past midnight
// (e.g. 20:00-01:00) and ends on the following day.
function extraHoursActive(slot, now){
  if(!slot || !slot.date || !slot.from || !slot.until) return false;
  if(slot.until > slot.from) return now.date === slot.date && now.time >= slot.from && now.time < slot.until;
  return (now.date === slot.date && now.time >= slot.from) || (now.date === nextDateStr(slot.date) && now.time < slot.until);
}

function shopWithinHours(now){
  if(regularHoursOpen(shopHours(), now.day, now.time)) return true;
  return (state.shopExtraHours || []).some(slot => extraHoursActive(slot, now));
}

// Recomputes holiday + operating-hours flags; returns true when the customer
// screen needs re-rendering.
function refreshShopOpenState(){
  const before = [state.shopClosed, state.shopClosedFrom, state.shopClosedUntil, state.shopOutsideHours].join('|');
  const now = shopNow();
  const active = (state.shopHolidays || []).find(h => now.date >= h.from && now.date <= h.until);
  state.shopClosed = !!active;
  state.shopClosedFrom = active ? active.from : '';
  state.shopClosedUntil = active ? active.until : '';
  state.shopOutsideHours = !shopWithinHours(now);
  return before !== [state.shopClosed, state.shopClosedFrom, state.shopClosedUntil, state.shopOutsideHours].join('|');
}

// The last schedule the server sent, kept on the device. On the next launch
// it is used straight away, until the fresh answer arrives a second or two
// later; without it the app could only assume the default hours.
const SCHEDULE_CACHE_KEY = 'kfedeSolSchedule';
function rememberSchedule(){
  try{
    localStorage.setItem(SCHEDULE_CACHE_KEY, JSON.stringify({
      holidays: state.shopHolidays || [], extraHours: state.shopExtraHours || [], hours: state.shopHours
    }));
  }catch(e){}
}
function restoreSchedule(){
  try{
    const saved = JSON.parse(localStorage.getItem(SCHEDULE_CACHE_KEY) || 'null');
    if(!saved) return;
    if(Array.isArray(saved.holidays)) state.shopHolidays = saved.holidays;
    if(Array.isArray(saved.extraHours)) state.shopExtraHours = saved.extraHours;
    if(Array.isArray(saved.hours)) state.shopHours = normalizeShopHours(saved.hours);
  }catch(e){}
}

async function loadShopStatus(){
  const previousLists = JSON.stringify([state.shopHolidays, state.shopExtraHours, state.shopHours]);
  const data = await gasGet('meta', {key:'shop-status'});
  if(!data || data.value == null) return refreshShopOpenState();
  try{
    const status = typeof data.value === 'string' ? JSON.parse(data.value) : data.value;
    state.shopHolidays = Array.isArray(status.holidays) ? status.holidays : (status.from && status.until ? [{id:'legacy',from:status.from,until:status.until}] : []);
    state.shopExtraHours = Array.isArray(status.extraHours) ? status.extraHours : [];
    // The server adds the regular hours to this answer. An older server does
    // not, and the defaults then apply.
    if(Array.isArray(status.hours)) state.shopHours = normalizeShopHours(status.hours);
    state.shopClosedReason = 'Kedai sedang cuti';
    rememberSchedule();
  }catch(e){ state.shopHolidays = String(data.value) === 'closed' ? [{id:'legacy',from:'0000-01-01',until:'9999-12-31'}] : []; }
  const stateChanged = refreshShopOpenState();
  return stateChanged || previousLists !== JSON.stringify([state.shopHolidays, state.shopExtraHours, state.shopHours]);
}

async function saveShopStatus(closed, reason, from, until){
  const status = {closed:!!closed, reason:reason || 'Kedai sedang cuti', from:from || '', until:until || ''};
  const result = await gasPost('setMeta', {key:'shop-status', value:JSON.stringify(status)});
  if(result && result.ok){ const today=new Date().toISOString().slice(0,10); state.shopClosed=status.closed || (!!status.from && !!status.until && today>=status.from && today<=status.until); state.shopClosedReason=status.reason; state.shopClosedFrom=status.from; state.shopClosedUntil=status.until; }
  return !!(result && result.ok);
}

// Holidays and extra-hours slots share the one 'shop-status' meta value, so
// every save writes both lists.
async function saveShopSchedule(){
  const status = {holidays:state.shopHolidays || [], extraHours:state.shopExtraHours || []};
  refreshShopOpenState();
  const result = await gasPost('setMeta', {key:'shop-status', value:JSON.stringify(status)});
  return !!(result && result.ok);
}

// Regular hours are kept in their own record ('shop-hours'), so a device
// still running an older version cannot wipe them when it saves a holiday.
async function saveShopHours(hours){
  const clean = normalizeShopHours(hours);
  const result = await gasPost('setMeta', { key:'shop-hours', value: JSON.stringify(clean) });
  if(!result || !result.ok) return false;
  state.shopHours = normalizeShopHours(result.hours || clean);
  refreshShopOpenState();
  return true;
}

async function saveHolidayList(holidays){
  state.shopHolidays = holidays || [];
  return saveShopSchedule();
}

async function saveExtraHoursList(slots){
  // Drop slots that finished before yesterday so the list does not grow forever.
  const yesterday = new Date(shopNow().date + 'T00:00:00Z');
  yesterday.setUTCDate(yesterday.getUTCDate() - 1);
  const cutoff = yesterday.toISOString().slice(0,10);
  state.shopExtraHours = (slots || []).filter(s => s.date >= cutoff);
  return saveShopSchedule();
}

/* ---------- menu meta (descriptions + image URLs from Sheets/Drive) ---------- */
async function loadMenuMeta(){
  try{
    const data = await gasGet('menuMeta');
    if(!data || data.error) return;
    if(data.items && data.items.length > 0){
      let changed = false;
      data.items.forEach(item => {
        // Always update desc
        if(item.desc){ menuDescs[item.id] = item.desc; }

        // Always update image
        if(item.imageUrl){
          let url = item.imageUrl;
          const idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
          if(idMatch) url = 'https://drive.google.com/thumbnail?id=' + idMatch[1] + '&sz=w300';
          if(menuImages[item.id] !== url){ menuImages[item.id] = url; changed = true; }
        }

        // Always update name from Sheets (Sheets is source of truth)
        if(item.name){
          if(menuNames[item.id] !== item.name){
            menuNames[item.id] = item.name;
            const menuItem = MENU.find(m => m.id === item.id);
            if(menuItem) menuItem.name = item.name;
            changed = true;
          }
        }

        // Always update price from Sheets
        if(item.price !== null && item.price !== ''){
          const p = parseFloat(item.price);
          if(!isNaN(p) && menuPrices[item.id] !== p){
            menuPrices[item.id] = p;
            const menuItem = MENU.find(m => m.id === item.id);
            if(menuItem) menuItem.price = p;
            changed = true;
          }
        }

        if(item.published !== undefined && item.published !== null && item.published !== ''){
          const published = !(item.published === false || String(item.published).toLowerCase() === 'false' || String(item.published) === '0');
          if(menuPublished[item.id] !== published){
            menuPublished[item.id] = published;
            if(!published && state.cart[item.id]) state.cart[item.id] = 0;
            changed = true;
          }
        }
      });
      if(changed && state.view === 'menu') render();
      if(changed && state.view === 'admin' && (state.adminTab || 'pesanan') !== 'menu') render();
    }
  } catch(e){
    console.warn('loadMenuMeta skipped:', e.message || e);
  }
}

async function gasMenuSaveDesc(itemId, desc){

}

let lastOrdersCache = null; // null until the first successful load
async function loadOrders(){

  if(data && Array.isArray(data.orders)){ lastOrdersCache = data.orders; return data.orders; }

// Customers only fetch their own orders: { ids:[...] } or { phone }.
// Returns null when the backend could not be reached.
async function loadMyOrders(query){
  const params = query.ids ? { ids: query.ids.join(',') } : { phone: query.phone };
  const data = await gasGet('myOrders', params, 15000);
  if(data && Array.isArray(data.orders)) return data.orders;
  if(data && data.error === 'unknown action'){
    // Apps Script not yet redeployed with v3.3.1: fall back to the full list.
    const fallback = await gasGet('orders', null, 15000);
    if(!fallback || !Array.isArray(fallback.orders)) return null;
    return query.ids
      ? fallback.orders.filter(o => query.ids.includes(o.id))
      : fallback.orders.filter(o => String(o.customerPhone || '') === String(query.phone));
  }
  return null;
}
async function addOrder(order){
  const data = await gasPost('addOrder', { order });
  return data || { queueNo: 0 };
}
async function bulkUpdateStatus(key, newStatus, fromStatus){
  await gasPost('bulkUpdateStatus', { key, newStatus, fromStatus });
}
async function updateOrderStatus(id, status, reason){
  const result = await gasPost('updateOrderStatus', { id, status, reason });
  // Instant update for customer/admin tabs on the same device. Other devices
  // receive the same persisted status through the regular backend polling.
  try{
    localStorage.setItem('kfedeSolOrderStatusSync', JSON.stringify({ id, status, at:Date.now() }));
  }catch(e){}
  return result;
}
// Admin status changes show on screen immediately; the save runs behind it.
// While a save is in flight, polled data still carries the old status, so the
// pending value is laid over it to stop the card flicking back.
// The overlay stays until the server itself reports the new status (or 20s
// pass). Dropping it as soon as the save returned let a poll that had started
// earlier put the old status back for a few seconds, which made the Siap
// card flick back and the WhatsApp button vanish.
const pendingOrderStatuses = {};
function applyPendingOrderStatuses(orders){
  const now = Date.now();
  return (orders || []).map(o => {
    const pending = pendingOrderStatuses[o.id];
    if(!pending) return o;
    if(o.status === pending.status || now > pending.until){ delete pendingOrderStatuses[o.id]; return o; }
    return Object.assign({}, o, { status:pending.status });
  });
}
async function adminSetOrderStatus(id, status){
  const order = (state.allOrders || []).find(o => o.id === id);
  const previous = order ? order.status : null;
  if(order) order.status = status;
  pendingOrderStatuses[id] = { status, until: Date.now() + 20000 };
  render();
  let result = await updateOrderStatus(id, status);
  // One retry: Apps Script sometimes drops a request or is briefly locked.
  if(!result || !result.ok) result = await updateOrderStatus(id, status);
  if(!result || !result.ok){
    delete pendingOrderStatuses[id];
    const current = (state.allOrders || []).find(o => o.id === id);
    if(current && previous !== null) current.status = previous;
    showToast('Gagal simpan status ke server. Cuba lagi.', 'error');
    render();
    return false;
  }
  if(order){
    const who = (state.loggedInAdmin && state.loggedInAdmin.name) || 'admin';
    const base = String(status).split('|')[0], why = String(status).split('|').slice(1).join('|');
    logActivity(`st:${id}:${base}`, base, `${queueLabelOf(order)} (${order.customerName || '-'}) ditanda ${ORDER_STATUS_LABEL[base] || base} oleh ${who}${why ? ': ' + why : ''}`);
  }
  return true;
}

  if(!/[a-zA-Z]/.test(pw)) return false;                                  // sekurang-kurangnya 1 huruf
  if(!/[!@#$%^&*(),.?":{}|<>_\-+=~`[\]\\/;']/.test(pw)) return false;     // sekurang-kurangnya 1 simbol

}

/* Load the current customer's loyalty progress for the Promosi page */
async function loadMyLoyalty(){
  state.myLoyaltyLoading = true;
  state.myLoyaltyError = false;
  const phone = state.customer ? state.customer.phone : '';
  // Never block the promotion page while Google Apps Script wakes up. Show the
  // most recent successful value (or zero) immediately, then refresh it quietly.
  if(state.myLoyalty === undefined){
    let cached = null;
    try{ cached = JSON.parse(localStorage.getItem('kfedeSolLoyalty_' + phone) || 'null'); }catch(e){}
    state.myLoyalty = cached && cached.data ? cached.data : { count: 0, qty: 0 };
    state.myLoyaltyKnown = !!(cached && cached.data);
    if(cached && cached.points) state.myPoints = cached.points;
    Promise.resolve().then(()=>render());
  }
  try{
    // Apps Script can take well over 5s when it is busy or waking up.
    // v3.10.0: nama dihantar supaya pelanggan baru terus dapat kod referral
    let data = await gasGet('myLoyalty', { phone, name: (state.customer && state.customer.name) || '' }, 20000);
    if(data && data.error === 'unknown action'){
      // Apps Script not yet redeployed with v3.3.1: use the old full list.
      const legacy = await gasGet('customers', null, 20000);
      data = legacy && legacy.customers ? { customer: legacy.customers[phone] || null } : null;
    }
    if(!data || !('customer' in data)) throw new Error('Data pelanggan tidak tersedia');
    state.myLoyalty = (phone && data.customer) ? data.customer : { count: 0, qty: 0 };
    state.myLoyaltyKnown = true;
    if(data.points && typeof data.points === 'object') state.myPoints = data.points;
    try{
      localStorage.setItem('kfedeSolLoyalty_' + phone, JSON.stringify({ data:state.myLoyalty, points:state.myPoints || null, at:Date.now() }));
    }catch(e){}
  }catch(e){
    console.error('loyalty progress failed', e);
    state.myLoyaltyError = true;
    // Retry quietly instead of leaving the card stuck on the error message.
    setTimeout(()=>{
      if(state.myLoyaltyError && !state.myLoyaltyLoading && state.customer && state.customer.phone === phone) loadMyLoyalty();
    }, 30000);
  }finally{
    state.myLoyaltyLoading = false;
    render();
  }
}

  if(state.promotionsLoading) return false;
  const now = Date.now();
  if(!state.promotionsLoaded) return now - (state.promotionsFailedAt || 0) > 15000;
  return now - (state.promotionsFetchedAt || 0) > 60000;
}
async function loadPromotions(){
  if(state.promotionsLoading) return;
  state.promotionsLoading = true;
  let changed = false;
  try{
    const data = await gasGet('promotions', null, 25000);
    if(data && Array.isArray(data.promotions)){
      const next = ['gambar promosi.webp', ...data.promotions.map(item=>item && item.url).filter(Boolean)];
      const typesBefore = JSON.stringify(state.promotionTypes || {});
      rememberPromotionTypes(data.promotions);
      if(JSON.stringify(state.promotionTypes) !== typesBefore) changed = true;
      changed = JSON.stringify(next) !== JSON.stringify(state.customerPromotions);
      if(changed){
        state.customerPromotions = next;
        state.promoCarouselCount = 0;
      }
      state.promotionsLoaded = true;
      state.promotionsFetchedAt = Date.now();
    }else{
      state.promotionsFailedAt = Date.now();
    }
  }catch(e){
    console.error('promotion list failed', e);
    state.promotionsFailedAt = Date.now();
  }
  finally{
    state.promotionsLoading = false;
    if(changed && state.view === 'promo') render();
  }
}

function readPromotionFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Fail gambar tidak dapat dibaca.'));
    reader.readAsDataURL(file);
  });
}

async function uploadPromotionalImages(input){
  const files = Array.from(input.files || []);
  if(!files.length || state.promoUploadBusy) return;
  const invalid = files.find(file => file.type !== 'image/webp' || file.size > 5 * 1024 * 1024);
  if(invalid){
    showToast(invalid.size > 5 * 1024 * 1024 ? 'Setiap gambar WebP mesti 5 MB atau kurang.' : 'Upload gambar dalam format WebP sahaja.', 'error');
    input.value = '';
    return;
  }
  state.promoUploadBusy = true;
  state.promoUploadStatus = `Sedang memuat naik 0/${files.length} gambar...`;
  render();
  let uploaded = 0;
  try{
    if(!Array.isArray(state.adminPromotions)) state.adminPromotions = [];
    for(const file of files){
      state.promoUploadStatus = `Sedang memuat naik ${uploaded + 1}/${files.length}: ${escapeHtml(file.name)}`;
      render();
      const base64 = await readPromotionFile(file);
      const result = await gasPost('savePromotionImage', { base64, mimeType:file.type, name:file.name, type:state.promoUploadType === 'notice' ? 'notice' : 'promo' }, 90000);
      if(!result || !result.ok || !result.promotion){
        throw new Error(result && result.error === 'SESSION_INVALID' ? 'Sesi Admin tamat. Log masuk semula.' : (result && result.error) || 'Upload gagal.');
      }
      state.adminPromotions.push(result.promotion);
      uploaded++;
    }
    state.customerPromotions = ['gambar promosi.webp', ...state.adminPromotions.filter(item=>item.visible !== false).map(item=>item.url)];
    rememberPromotionTypes(state.adminPromotions);
    state.promotionsLoaded = true;
    state.promoUploadStatus = `Siap. ${uploaded} gambar ditambah ke hebahan.`;
    showToast(`${uploaded} gambar hebahan berjaya dimuat naik.`, 'success');
  }catch(e){
    state.promoUploadStatus = `Upload terhenti selepas ${uploaded}/${files.length} gambar: ${escapeHtml(e.message)}`;
    showToast('Upload promosi tidak selesai. Semak sambungan dan cuba lagi.', 'error');
  }finally{
    state.promoUploadBusy = false;
    render();
  }
}

/* ---------- render root ---------- */
/* render() rebuilds the page with innerHTML, which used to throw every list
   back to the top (after pressing +, or whenever a status poll redrew the
   page). The scroll position of each scrolling area is now carried over as
   long as the same screen is being redrawn. */
const SCROLL_AREAS = ['.menu-list', '.primary-tab-page', '.waiting', '.admin-wrap', '.activity-list', '.menu-cat-tabs', '.zoom-modal-content'];
var renderedScrollKey = null;
function scrollKey(){
  return [state.view, state.menuCategory || '', state.adminTab || '', state.adminSubTab || '', state.activeQueueId || '', state.itemDetailId || ''].join('|');
}
// Hanya kotak ini (borang notifikasi & carian pelanggan) dikekalkan fokus semasa lukis semula
const KEEP_FOCUS_IDS = ['custSearch', 'custPushTitle', 'custPushBody', 'pushPromoTitle', 'pushPromoBody', 'rwSearch', 'rwTitle', 'rwPoints', 'rwPerCup', 'refCodeInput', 'rwUseRm', 'rwRefRm', 'rwRefMax'];
function render(){
  const frame = document.getElementById('app-frame');
  const key = scrollKey();
  const saved = key === renderedScrollKey
    ? SCROLL_AREAS.map(sel => { const el = frame.querySelector(sel); return el ? [el.scrollTop, el.scrollLeft] : null; })
    : null;
  // v3.6.0: kotak yang sedang ditaip (ada id) kekal fokus bila page dilukis semula,
  // cth. pesanan baru masuk semasa admin menaip notifikasi atau carian pelanggan.
  const active = document.activeElement;
  const focusId = active && KEEP_FOCUS_IDS.includes(active.id) && frame.contains(active) ? active.id : null;
  const caret = focusId ? [active.selectionStart, active.selectionEnd] : null;
  renderPage();
  if(focusId){
    const el = document.getElementById(focusId);
    if(el && el !== document.activeElement){
      el.focus({ preventScroll:true });
      try{ if(caret[0] != null) el.setSelectionRange(caret[0], caret[1]); }catch(e){}
    }
  }
  // The bottom strips are placed above the tab bar using its real height.
  const tabbar = frame.querySelector('.customer-tabbar');
  if(tabbar && tabbar.offsetHeight) frame.style.setProperty('--tabbar-h', tabbar.offsetHeight + 'px');
  renderedScrollKey = key;
  if(saved) SCROLL_AREAS.forEach((sel, i) => {
    const el = saved[i] && frame.querySelector(sel);
    if(el){ el.scrollTop = saved[i][0]; el.scrollLeft = saved[i][1]; }
  });
}

function renderPage(){
  persistAppSession();
  updateOrderAlarm();
  updateWakeLock();
  armAdminBackGuard();
  const frame = document.getElementById('app-frame');
  const customerTabViews = ['menu','item-detail','preview','waiting','promo','rewards','reward-rules','location','account','orders','receipts'];
  frame.className = state.view === 'admin' ? 'admin-mode' :
    (state.customer && customerTabViews.includes(state.view) ? 'customer-mode' : '');

  // A scheduled holiday blocks the customer flow immediately, even before
  // registration/login. Admin access remains available from the close screen.
  if(state.shopClosed && state.view !== 'admin' && state.view !== 'admin-login'){
    frame.innerHTML = renderShopClosed();
    const adminBtn = document.getElementById('closedAdminLogin');
    if(adminBtn) adminBtn.onclick = () => { state.view='admin-login'; render(); };
    return;
  }

  // Outside operating hours the customer sees the opening-hours poster. A
  // customer already waiting on an order keeps their queue screen.
  if(state.shopOutsideHours && !['admin','admin-login','waiting'].includes(state.view)){
    frame.innerHTML = renderOutsideHours();
    const adminBtn = document.getElementById('closedAdminLogin');
    if(adminBtn) adminBtn.onclick = () => { state.view='admin-login'; render(); };
    return;
  }

  if(state.view === 'splash'){
    frame.innerHTML = renderSplash();
    setupIntroVideoPlaylist(frame);
    const start = frame.querySelector('#introStart');
    if(start) start.onclick = () => {
      if(start.dataset.started === '1') return;
      start.dataset.started = '1';
      start.disabled=true;
      const splash=frame.querySelector('.hero'); if(splash) splash.classList.add('playing');
      state.view=state.customer?'promo':'register';
      render();
    };
    return;
  }

  let body = '';
  if(state.view === 'admin'){
    body = renderAdmin();
    if(!state.customerReport && !state.reportLoading){ loadCustomerReport(); }
    if((state.adminTab||'pesanan') === 'pengurusan' && !state.adminAccounts && !state.adminAccountsLoading){ loadAdminAccounts(); }
    if((state.adminTab||'pesanan') === 'pengurusan' && !state.displaySettings && !state.displaySettingsLoading){ loadDisplaySettings(); }

    if(state.adminTab === 'sistem' && state.serverVersion === undefined && !state.serverVersionLoading){ loadServerVersion(); }

  } else if(state.view === 'admin-login'){
    body = renderAdminLogin();
  } else if(state.view === 'register'){
    body = renderRegister();
  } else if(state.view === 'check-order'){

  if((state.view === 'rewards' || (state.view === 'admin' && state.adminTab === 'reward')) && rewardsDue()) loadRewards();

        const logoutAuth = { adminId: state.loggedInAdmin && state.loggedInAdmin.id, authToken: state.adminSessionToken };
        const sendLogout = (action, extra) => fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, keepalive:true,

        // (sebelum sesi ditamatkan, kerana action itu perlu sesi yang sah)
        const hadAdminPush = !!adminPushPref();

          if(hadAdminPush){

        })();

        state.adminAccounts = null;

      render();
    };

  const customerAdminBtn = document.getElementById('customerAdminBtn');
  if(customerAdminBtn){
    customerAdminBtn.onclick = () => {
      state.view = (state.loggedInAdmin && state.adminSessionToken) ? 'admin' : 'admin-login';

  if(state.lightboxImage){
    const overlay = document.getElementById('lightboxOverlay');

    const close = () => { state.lightboxImage = null; render(); };
    if(closeBtn) closeBtn.onclick = close;

  // (item detail feature disabled - will be re-implemented cleanly)

  // (pmenu upload uses global handlePmenuUpload - see function below)

  // Hot/Ice temp toggle buttons
  document.querySelectorAll('.temp-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {

          card.querySelectorAll('.temp-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        }

  bindViewEvents();
  setupPromoCarousel();
  setupPolling();
  setupVisibilityCatchup();
}

const INTRO_BACKGROUND_VIDEOS = ['intro-background.mp4', 'intro-background-2.mp4'];
function setupIntroVideoPlaylist(frame){
  const video = frame.querySelector('#introBackgroundVideo');
  const fog = frame.querySelector('.hero-video-fog');
  if(!video || !fog) return;
  let index = 0;
  const restartFog = () => {
    const seconds = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 10;
    fog.style.animation = 'none';
    void fog.offsetWidth;
    fog.style.animation = `intro-fog ${seconds}s ease-in-out infinite`;
  };
  video.addEventListener('loadedmetadata', restartFog);
  video.addEventListener('ended', () => {
    index = (index + 1) % INTRO_BACKGROUND_VIDEOS.length;
    video.src = INTRO_BACKGROUND_VIDEOS[index];
    video.load();
    video.play().catch(() => {});
  });
  if(video.readyState >= 1) restartFog();
  video.play().catch(() => {});
}

let adminLoginLoaderTimer = null;
let adminLoginLoaderValue = 0;
let adminLogoutInProgress = false;
function showAdminLoginLoader(options){
  if(document.getElementById('adminLoginLoader')) return;
  const config = Object.assign({ heading:'LOGIN ADMIN', status:'Menyemak akaun admin...' }, options || {});
  adminLoginLoaderValue = 7;
  const overlay = document.createElement('div');
  overlay.id = 'adminLoginLoader';
  overlay.className = 'admin-login-loader';
  overlay.setAttribute('role','status');
  overlay.setAttribute('aria-live','polite');
  overlay.innerHTML = `
    <div class="admin-login-loader-card">
      <div class="admin-login-loader-title">NOW LOADING...</div>
      <div class="admin-login-loader-row"><span>${config.heading}</span><span id="adminLoginLoaderPercent">7%</span></div>
      <div class="admin-login-loader-track"><div class="admin-login-loader-fill" id="adminLoginLoaderFill"></div></div>
      <div class="admin-login-loader-status" id="adminLoginLoaderStatus">${config.status}</div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>{
    const fill = document.getElementById('adminLoginLoaderFill');
    if(fill) fill.style.transform = 'scaleX(.07)';
  });
  adminLoginLoaderTimer = setInterval(()=>{
    const step = adminLoginLoaderValue < 55 ? 5 : (adminLoginLoaderValue < 80 ? 2 : 1);
    adminLoginLoaderValue = Math.min(92, adminLoginLoaderValue + step);
    const fill = document.getElementById('adminLoginLoaderFill');
    const percent = document.getElementById('adminLoginLoaderPercent');
    if(fill) fill.style.transform = `scaleX(${adminLoginLoaderValue / 100})`;
    if(percent) percent.textContent = adminLoginLoaderValue + '%';
  }, 280);
}
function hideAdminLoginLoader(success, successStatus){
  if(adminLoginLoaderTimer){ clearInterval(adminLoginLoaderTimer); adminLoginLoaderTimer = null; }
  const overlay = document.getElementById('adminLoginLoader');
  if(!overlay) return Promise.resolve();
  if(!success){ overlay.remove(); return Promise.resolve(); }
  const fill = document.getElementById('adminLoginLoaderFill');
  const percent = document.getElementById('adminLoginLoaderPercent');
  const status = document.getElementById('adminLoginLoaderStatus');
  if(fill) fill.style.transform = 'scaleX(1)';
  if(percent) percent.textContent = '100%';
  if(status) status.textContent = successStatus || 'Login berjaya! Membuka panel admin...';
  return new Promise(resolve=>setTimeout(()=>{ overlay.remove(); resolve(); }, 350));
}

function getLoyaltyStats(){
  const loyalty = state.myLoyalty;
  // Keep showing the last known numbers while a refresh is running or failed.
  const known = !!state.myLoyaltyKnown;
  const ready = !!loyalty && (known || (!state.myLoyaltyLoading && !state.myLoyaltyError));
  const totalCups = ready ? (Number(loyalty.qty) || 0) : null;
  const freeCount = totalCups === null ? null : freeDrinksAvailable(loyalty);

let promoCarouselTimer = null;
setInterval(()=>{ if(state.view === 'promo' && promotionsDue()) loadPromotions(); }, 15000);
function promoTrackTransform(position, count){
  return `translateX(-${position / (count + 2) * 100}%)`;
}
function updatePromoCarouselDots(){
  document.querySelectorAll('.promo-carousel-dot').forEach((dot,index)=>{
    const active = index === state.promoSlideIndex;
    dot.classList.toggle('active', active);
    dot.setAttribute('aria-current', String(active));
  });
}
function movePromoCarousel(position, withoutMotion){
  const track = document.querySelector('.promo-marquee-track');
  if(!track) return;
  const count = Number(track.dataset.promoCount) || 0;
  state.promoTrackPosition = position;
  track.dataset.pos = String(position);
  if(withoutMotion){
    // Lompat senyap dari gambar salinan ke gambar sebenar. Baca offsetWidth supaya
    // browser guna kedudukan baru TANPA animasi sebelum transition dipasang semula;
    // tanpa ini telefon kadang-kadang animasikan lompatan (nampak macam rewind).
    track.style.transition = 'none';
    track.style.transform = promoTrackTransform(position, count);
    void track.offsetWidth;
    track.style.transition = '';
  }else{
    track.style.transform = promoTrackTransform(position, count);
  }
  updatePromoCarouselDots();
}
function schedulePromoCarouselAdvance(){
  if(promoCarouselTimer) clearTimeout(promoCarouselTimer);
  promoCarouselTimer = null;
  if(state.view !== 'promo' || state.promoCarouselCount < 2 || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  promoCarouselTimer = setTimeout(()=>{
    const count = state.promoCarouselCount;
    const advance = () => {
      const nextPosition = Math.max(0, state.promoTrackPosition - 1);
      state.promoSlideIndex = nextPosition === 0 ? count - 1 : nextPosition - 1;
      movePromoCarousel(nextPosition, false);
      schedulePromoCarouselAdvance();
    };
    // If a transitionend was missed (e.g. screen locked), the track can still
    // sit on a clone slide. Snap to the real slide first, then animate.
    if(state.promoTrackPosition <= 0 || state.promoTrackPosition >= count + 1){
      movePromoCarousel(state.promoTrackPosition <= 0 ? count : 1, true);
      requestAnimationFrame(()=>requestAnimationFrame(advance));
    }else{
      advance();
    }
  }, 4800);
}
function setupPromoCarousel(){
  const track = document.querySelector('.promo-marquee-track');
  const count = track ? Number(track.dataset.promoCount) || 0 : 0;
  if(state.view !== 'promo' || !track || count < 2){
    if(promoCarouselTimer) clearTimeout(promoCarouselTimer);
    promoCarouselTimer = null;
    return;
  }
  track.ontransitionend = event => {
    if(event.target !== track) return;
    if(state.promoTrackPosition === 0){
      movePromoCarousel(count, true);
    }else if(state.promoTrackPosition === count + 1){
      movePromoCarousel(1, true);
    }
  };
  if(!promoCarouselTimer) schedulePromoCarouselAdvance();
}

/* Promotion pictures live on Google Drive, which now and then answers
   "429 Too Many Requests". Instead of showing a broken-image icon the picture
   is tried again: the direct file link, then the thumbnail and the file link
   once more after a pause, and finally the built-in promo picture. */
const PROMO_DEFAULT_IMAGE = 'gambar promosi.webp';
function promoImageFailed(img){
  const stage = Number(img.dataset.retry || 0);
  img.dataset.retry = String(stage + 1);
  const original = img.dataset.fallbackUrl || '';
  const fresh = url => url + (url.indexOf('?') === -1 ? '?' : '&') + 'r=' + Date.now();
  if(!original || original === PROMO_DEFAULT_IMAGE || stage >= 3){
    // Nothing left to try. Stop here if even the built-in picture failed.
    if(img.getAttribute('src') !== PROMO_DEFAULT_IMAGE) img.src = PROMO_DEFAULT_IMAGE;
    return;
  }
  if(stage === 0){ img.src = original; return; }
  const next = stage === 1 ? fresh(promotionDisplayUrl(original)) : fresh(original);
  setTimeout(() => { if(img.isConnected) img.src = next; }, stage === 1 ? 2500 : 6000);
}

function promotionDisplayUrl(rawUrl){
  const url = String(rawUrl || '');
  if(!/drive\.google\.com/i.test(url)) return url;
  const match = url.match(/[?&]id=([^&]+)/) || url.match(/\/file\/d\/([^/]+)/);
  if(!match) return url;
  let id = match[1];
  try{ id = decodeURIComponent(id); }catch(e){}
  return `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1200`;
}

/* Progress bar 0 -> 20 cups with a free drink at every 5 (Starbucks-style). */
const REWARD_BAR_MAX = 20;
function renderRewardProgress(){
  const { totalCups, freeCount, redeems, note } = getLoyaltyStats();
  const hasFree = freeCount > 0;
  // The earliest milestones are the redeemed ones: with 2 redemptions, 5 and 10
  // show "Ditebus" + time; any later milestone reached is still waiting.
  const redeemLabel = ts => new Date(ts).toLocaleString('ms-MY', {day:'2-digit', month:'2-digit', hour:'numeric', minute:'2-digit', hour12:true});
  const cups = totalCups === null ? 0 : totalCups;
  const shown = Math.min(cups, REWARD_BAR_MAX);
  const fill = shown / REWARD_BAR_MAX * 100;
  // Animate the fill only when the number changes, not on every re-render.
  const animate = totalCups !== null && state.rewardBarShownCups !== cups;
  if(totalCups !== null) state.rewardBarShownCups = cups;
  const toNext = FREE_DRINKS_THRESHOLD - (cups % FREE_DRINKS_THRESHOLD);
  const nextText = totalCups === null ? note
    : cups >= REWARD_BAR_MAX ? 'Tahniah! Semua 4 air percuma bulan ini dicapai 🎉'
    : `${toNext} cawan lagi untuk air percuma seterusnya`;
  const milestones = [0,5,10,15,20].map(m => {
    const index = m / FREE_DRINKS_THRESHOLD - 1; // 5 -> 0, 10 -> 1, ...
    const reached = cups >= m;
    const redeemedAt = m > 0 && reached ? redeems[index] : undefined;
    const waiting = m > 0 && reached && !redeemedAt;
    const tag = m === 0 ? '' : redeemedAt ? `<span class="reward-node-gift redeemed">Ditebus<br>${redeemLabel(redeemedAt)}</span>`
      : waiting ? '<span class="reward-node-gift">Belum tebus</span>' : '<span class="reward-node-gift">1 free</span>';
    return `
    <div class="reward-node ${reached ? 'reached' : ''} ${redeemedAt ? 'redeemed' : ''} ${waiting ? 'unredeemed' : ''}" style="left:${m / REWARD_BAR_MAX * 100}%">
      <span class="reward-dot">${m > 0 && reached ? '✓' : ''}</span>
      <span class="reward-node-num">${m}</span>
      ${tag}
    </div>`;
  }).join('');
  return `<section class="reward-progress${hasFree ? ' has-free' : ''}" aria-label="Kemajuan reward: ${cups} daripada ${REWARD_BAR_MAX} cawan">
    ${hasFree ? `<div class="reward-free-banner">🎁 Anda ada <strong>${freeCount} air percuma</strong>! Tunjukkan skrin ini di kaunter untuk tebus.</div>` : ''}
    <div class="reward-progress-head">

        <div class="reward-progress-label">Cawan bulan ini</div></div>
      <div class="reward-progress-next">${nextText}</div>
    </div>
    <div class="reward-track">
      <div class="reward-track-line"></div>
      <div class="reward-track-fill ${animate ? 'animate' : ''}" style="--fill:${fill}%;width:${fill}%"></div>

function adminPushErrorText(e){
  const m = String(e && e.message || e || '');
  if(m === 'PUSH_KEY_MISSING') return 'Server belum ada PUSH_KEY. Semak Script Properties di Apps Script.';
  if(m === 'SESSION_INVALID') return 'Sesi admin tamat. Log masuk semula.';
  if(m === 'SW_TIMEOUT') return 'Telefon lambat menyiapkan notifikasi. Tutup & buka semula app, kemudian cuba lagi.';
  return 'Gagal. Semak internet dan cuba lagi.';
}
async function runAdminPush(task){
  if(state.adminPushBusy) return;
  state.adminPushBusy = true;
  state.adminPushMsg = '';
  render();
  try{ state.adminPushMsg = await task(); }
  catch(e){ console.error('admin push', e); state.adminPushMsg = '⚠️ ' + adminPushErrorText(e); }
  state.adminPushBusy = false;
  state.adminPushStatus = await adminPushStatus();
  render();
}
function adminPushOnMessage(r, repeat){
  if(r.status === 'blocked') return '⚠️ Notifikasi disekat. Benarkan di tetapan browser dahulu.';
  if(r.status !== 'on') return 'Notifikasi belum dibenarkan. Tekan Allow bila ditanya.';
  if(repeat && !r.trigger) return '✅ Aktif. ⚠️ Ulang setiap minit belum jalan: jalankan pasangNotifAdmin sekali di Apps Script.';
  return repeat ? '✅ Aktif. Berbunyi setiap minit sampai order di-Acknowledge.' : '✅ Aktif. Berbunyi sekali bagi setiap order baru.';
}
function bindAdminPushSetting(){
  const repeatToggle = document.getElementById('adminPushRepeatToggle');
  if(repeatToggle) repeatToggle.onchange = () => {
    const repeat = repeatToggle.checked;
    if(state.adminPushStatus !== 'on'){ state.adminPushRepeatDraft = repeat; return; }
    runAdminPush(async () => adminPushOnMessage(await enableAdminPush(repeat), repeat));
  };
  const onBtn = document.getElementById('adminPushOn');
  if(onBtn) onBtn.onclick = () => {
    const repeat = state.adminPushRepeatDraft !== false;
    runAdminPush(async () => {
      const r = await enableAdminPush(repeat);
      if(r.status === 'on') testAdminPush().catch(() => {});
      return adminPushOnMessage(r, repeat);
    });
  };
  const testBtn = document.getElementById('adminPushTest');
  if(testBtn) testBtn.onclick = () => runAdminPush(async () => {
    const r = await testAdminPush();
    if(!r || !r.ok) throw new Error((r && r.error) || 'SERVER');
    return r.sent > 0 ? '✅ Ujian dihantar. Telefon ini patut berbunyi sekejap lagi.' : '⚠️ Telefon ini tidak berdaftar. Tekan Matikan, kemudian Hidupkan semula.';
  });
  const offBtn = document.getElementById('adminPushOff');
  if(offBtn) offBtn.onclick = () => runAdminPush(async () => { await disableAdminPush(); return 'Notifikasi order baru dimatikan di telefon ini.'; });
}

function getCustomerOrderHistory(){
  const seen = new Set();
  return [...(state.myOrders || []), ...(state.myReceipts || [])]
    .filter(o => o && !seen.has(o.id) && seen.add(o.id))
    .sort((a,b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
}

function orderStatusLabel(o){
  const status = orderStatus(o);
  if(status === 'siap') return 'Siap diambil';
  if(status === 'sedang_dibuat') return 'Sedang dibuat';
  if(status === 'selesai') return 'Selesai';
  if(status === 'rejected') return 'Ditolak';
  return 'Pesanan diterima';
}

function renderOrders(){
  const orders = getCustomerOrderHistory();
  if(!orders.length) return `<div class="waiting"><p>Belum ada sejarah pesanan.</p></div>`;
  const cards = orders.map(o => {
    const status = orderStatus(o);
    const rejected = isOrderRejected(o);
    const done = status === 'siap' || status === 'selesai';
    const statusClass = rejected ? 'rejected' : (done ? 'done' : 'pending');
    const statusText = rejected ? 'Batal / Reject' : (status === 'selesai' ? 'Selesai' : (status === 'siap' ? 'Dah siap' : 'Belum siap'));
    const items = (o.items || []).map(i=>`<div class="order-history-item"><span>${escapeHtml(i.name)} x${i.qty}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('');
    const date = new Date(o.createdAt).toLocaleString('ms-MY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<article class="order-history-card">
      <div class="order-history-top">
        <div><div class="order-history-number">No. Giliran ${String(o.queueNo).padStart(3,'0')}</div><div class="order-history-date">${date}</div></div>
        <div class="order-history-summary"><span class="order-history-status ${statusClass}">${statusText}</span><div class="order-history-price">${fmt(o.total)}</div></div>
      </div>
      <div class="order-history-items">${items}</div>
    </article>`;
  }).join('');
  return `<div class="orders-history-view"><h1 class="orders-history-title">Sejarah Order</h1><div class="orders-history-list">${cards}</div></div>`;
}

/* Kesan pada gambar air di page detail: asap berpintal untuk Hot, embun +
   titisan meleleh untuk Ice. Air tanpa pilihan Hot/Ice (mocktail, matcha)
   sentiasa sejuk. Kedudukan dalam % kotak gambar (cawan di tengah). */
function drinkIsHot(item, temp){ return item.temp === 'both' && temp === 'hot'; }
function drinkFxLayers(hot, src){
  if(hot) return `<canvas class="fx-steam-canvas" width="180" height="200" aria-hidden="true"></canvas>`;
  // susunan rawak tetap (seed) supaya embun tak melompat setiap kali page dilukis semula
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const onCup = y => 50 + (rnd() * 2 - 1) * (27 - (y - 20) * 0.08) * 0.88; // cawan mengecil ke bawah
  let beads = '';
  for(let i = 0; i < 70; i++){
    const y = 16 + rnd() * 78, s = 2 + Math.round(rnd() * rnd() * 5);
    beads += `<span class="fx-bead" style="--x:${onCup(y).toFixed(1)}%;--y:${y.toFixed(1)}%;--s:${s}px"></span>`;
  }
  const drops = [[33,26,0,7],[66,30,2.5,8.5],[37,46,4.8,7.5],[63,50,1.2,9],[35,62,6.5,8],[65,64,3.6,7.2]]
    .map(([x,y,d,dur], i) => `<span class="fx-drop" style="--x:${x}%;--y:${y}%;--d:${d}s;--dur:${dur}s;--s:${6 + (i % 3)}px;--len:${48 + (i % 3) * 16}px"></span>`).join('');
  // bentuk gambar air jadi pemotong: embun hanya nampak di atas cawan
  const mask = `url(&quot;${String(src || '').replace(/"/g, '%22')}&quot;)`;
  return `<span class="fx-layer fx-wet" style="--mask:${mask}" aria-hidden="true">${beads}${drops}</span>`;
}
/* Asap: beberapa helai asap naik berpintal (gelombang bergerak ke atas),
   makin lebar dan pudar bila tinggi. Berhenti sendiri bila canvas dibuang. */
function startSteam(canvas){
  if(!canvas || canvas._steam) return;
  canvas._steam = true;
  const ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wisps = [
    { x:.42, a:10, k:.045, w:1.5, p:0,   p2:1.7, life:1   },
    { x:.55, a:13, k:.038, w:1.2, p:2.1, p2:.4,  life:.92 },
    { x:.48, a:8,  k:.052, w:1.8, p:4.2, p2:3.1, life:.8  },
    { x:.62, a:9,  k:.048, w:1.4, p:1.3, p2:5.2, life:.7  },
    { x:.36, a:7,  k:.055, w:1.6, p:3.4, p2:2.2, life:.65 }
  ];
  const draw = now => {
    if(!canvas.isConnected) return;
    const t = now / 1000;
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round';
    wisps.forEach((s, i) => {
      // setiap helai menebal dan menipis perlahan supaya asap nampak hidup
      const breathe = .55 + .45 * Math.sin(t * .7 + i * 1.9);
      const top = H * (1 - s.life);
      let px = null, py = null;
      for(let y = H; y >= top; y -= 4){
        const h = (H - y) / H;                       // 0 di bawah, 1 di atas
        const amp = s.a * (0.4 + h * 2.2);
        const x = W * s.x + amp * Math.sin(y * s.k + t * s.w * 2 + s.p)
                + amp * .45 * Math.sin(y * s.k * 2.3 - t * s.w * 1.3 + s.p2);
        if(px !== null){
          const fade = Math.min(1, h * 6) * Math.pow(1 - (H - y) / (H - top), 1.6);
          const alpha = .34 * fade * breathe;
          ctx.strokeStyle = `rgba(255,255,255,${alpha * .45})`;
          ctx.lineWidth = 6 + h * 26;
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
          ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
          ctx.lineWidth = 1.6 + h * 7;
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
        }
        px = x; py = y;
      }
    });
    if(!still) requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

/* ---------- popularity loading ---------- */
async function loadPopularItems(){
  state.popularLoading = true;
  const orders = await loadOrders();
  const counts = {};
  orders.forEach(o => {
    (o.items || []).forEach(i => {
      counts[i.name] = (counts[i.name] || 0) + i.qty;
    });
  });

  let ids = [];
  const sortedNames = Object.entries(counts).sort((a,b) => b[1] - a[1]).map(e => e[0]);
  for(const name of sortedNames){
    const m = MENU.find(x => x.name === name);
    if(m && !ids.includes(m.id)) ids.push(m.id);
    if(ids.length >= 3) break;
  }
  if(ids.length < 3){
    for(const m of MENU){
      if(!ids.includes(m.id)) ids.push(m.id);
      if(ids.length >= 3) break;
    }
  }

  state.popularIds = ids;
  state.popularLoading = false;
  render();
}

/* ---------- TV screen: video file and sound, kept on this device ----------
   The video is stored in this browser (IndexedDB), not uploaded, so it must be
   picked on the laptop that drives the TV. skrin.html on the same laptop reads
   the same storage and is told about changes through localStorage. */
function displayVideoDb(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('kfeDisplay', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('files');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function displayVideoRequest(mode, action){
  const db = await displayVideoDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('files', mode);
    const req = action(tx.objectStore('files'));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
  });
}
