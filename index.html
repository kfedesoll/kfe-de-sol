    el.textContent = new Date().toLocaleTimeString('ms-MY');
  };
  update();
  clockTimer = setInterval(update, 1000);
}

async function submitOrder(){
  const items = MENU.filter(m => (state.cart[m.id]||0) > 0)
    .map(m => {
      const temp = m.temp === 'both' ? (state.itemTemp[m.id] || 'hot') : null;
      const name = temp ? m.name + ' (' + (temp === 'hot' ? 'Hot' : 'Ice') + ')' : m.name;
      return { name, qty: state.cart[m.id], price: m.price };
    });
  if(items.length === 0) return;

  const ctx = getAudioCtx();
  if(ctx && ctx.state === 'suspended') ctx.resume();
  if(typeof Notification !== 'undefined' && Notification.permission === 'default'){
    // Push: minta izin dan langgan sekali gus, supaya "pesanan siap" sampai walaupun app ditutup
    if(pushSupported() && state.customer){
      enablePush(state.customer.phone).then(s => { state.pushStatus = s; }).catch(e => console.error('enablePush failed', e));
    } else {
      try{ Notification.requestPermission(); }catch(e){}
    }
  }

  state.submitting = true;
  render();

  const total = items.reduce((s,i)=>s + i.price*i.qty, 0);
  const order = {
    id: 'o_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    items,
    total,
    status: 'pending',
    createdAt: Date.now(),
    customerName: state.customer ? state.customer.name : '',
    customerPhone: state.customer ? state.customer.phone : ''
  };

  let added = await addOrder(order);
  if(!added.queueNo && !added.error){
    // No answer (network drop or timeout). The order may still have been
    // saved, so look it up once before telling the customer it failed.
    const found = await loadMyOrders({ ids:[order.id] });
    if(found && found.length) added = { queueNo: found[0].queueNo, loyalty: found[0].loyalty };
  }
  if(!added.queueNo && added.error !== 'SHOP_CLOSED'){
    state.submitting = false;
    showToast(added.error === 'INVALID_ORDER' ? 'Pesanan tidak sah. Sila semak troli anda.' : 'Pesanan gagal dihantar. Semak internet anda dan cuba lagi.', 'error');
    render();
    return;
  }
  if(added.error === 'SHOP_CLOSED'){
    // Server says the shop is closed (time ran out, or a holiday was just set).
    // Keep the cart and show the closed screen with the latest schedule.
    state.submitting = false;
    showToast('Maaf, kedai sudah tutup. Pesanan tidak dihantar.', 'error');
    await loadShopStatus().catch(()=>{});
    render();
    return;
  }
  order.queueNo = added.queueNo || 0;
  // v3.3.1 backend credits loyalty itself when the admin completes the order.
  // Only older backends still expect the browser to record the purchase.
  if(added.loyalty === 'pending') order.loyalty = 'pending';
  else await recordCustomerPurchase(order);
  state.myLoyalty = undefined;

  state.myOrderIds.push(order.id);
  state.myOrders.push(order);
  state.activeQueueId = order.id;
  state.cart = {};
  state.itemTemp = {};
  state.view = 'waiting';
  state.submitting = false;
  render();
}

/* ---------- sound effects ---------- */
let lastUiBeepAt = 0;
document.addEventListener('pointerdown', (event) => {
  const button = event.target.closest('button');
  const now = performance.now();
  if(button && now - lastUiBeepAt > 180){ lastUiBeepAt = now; beep(520, 0.045, 0); }
}, {passive:true});
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx || audioCtx.state === 'closed'){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return audioCtx;
}
function beep(freq, duration, delay){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const play = () => {
    if(ctx.state === 'closed') return;
    const t0 = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  };
  // Mobile browsers may suspend/interupt Web Audio after a mode change,
  // backgrounding, or screen lock. Resume first, then schedule the beep.
  if(ctx.state === 'suspended' || ctx.state === 'interrupted'){
    ctx.resume().then(play).catch(() => { audioCtx = null; });
  } else {
    play();
  }
}

/* ---------- admin new-order alarm ----------
   order-alert.mp3 repeats every 8s while the admin dashboard has any order
   that has not been acknowledged yet, and stops once all are acknowledged. */
const ORDER_ALARM_INTERVAL_MS = 8000;
var orderAlarmAudio = null;
var orderAlarmTimer = null;

function isOrderUnacknowledged(o){
  const status = orderStatus(o);
  if(status === 'selesai' || status === 'rejected' || status === 'siap' || status === 'sedang_dibuat') return false;
  return !isOrderRejected(o) && !state.acknowledgedOrderIds.has(o.id);
}

function ringOrderAlarm(){
  if(!orderAlarmAudio){
    orderAlarmAudio = new Audio('order-alert.mp3');
    orderAlarmAudio.preload = 'auto';
  }
  try{
    orderAlarmAudio.currentTime = 0;
    const played = orderAlarmAudio.play();
    // Fall back to the built-in beeps if the browser refuses to play the file.
    if(played && played.catch) played.catch(() => playNewOrderSound());
  }catch(e){ playNewOrderSound(); }
}

function updateOrderAlarm(){
  const shouldRing = state.view === 'admin' && !!state.loggedInAdmin &&
    (state.allOrders || []).some(isOrderUnacknowledged);
  if(shouldRing && !orderAlarmTimer){
    ringOrderAlarm();
    orderAlarmTimer = setInterval(ringOrderAlarm, ORDER_ALARM_INTERVAL_MS);
  } else if(!shouldRing && orderAlarmTimer){
    clearInterval(orderAlarmTimer);
    orderAlarmTimer = null;
    if(orderAlarmAudio){ orderAlarmAudio.pause(); orderAlarmAudio.currentTime = 0; }
  }
}

/* ---------- shared: refresh status of all tracked orders ---------- */
const CUSTOMER_AUTO_JUMP_VIEWS = ['menu', 'preview', 'promo', 'waiting'];

/* Re-fetch all orders and update state.myOrders for this customer's
   tracked queue numbers. If any order just became "siap", fire the
   ready notification and (if the customer is on a normal browsing
   view, not a modal) switch to the "No. Giliran" page for that order.
   If any order just became "selesai" (admin confirmed customer has
   collected the drink), a receipt snapshot is saved into
   state.myReceipts (so the customer can review it later this session),
   then it is dropped entirely from myOrderIds/myOrders - that queue
   number is done and should stop showing/blinking. If the customer
   was actively viewing a now-removed order, they're bounced back to
   the menu. Returns { changed, newlyReady }. */
async function refreshMyOrders(){
  if(!state.myOrderIds || state.myOrderIds.length === 0) return { changed:false, newlyReady:null };

  const orders = await loadMyOrders({ ids: state.myOrderIds });
  // Keep the current queue on screen when the backend is slow or unreachable.
  if(orders === null) return { changed:false, newlyReady:null, newlyRejected:null };
  const myOrdersAll = orders.filter(o => state.myOrderIds.includes(o.id));

  const prevMap = {};
  (state.myOrders||[]).forEach(o => { prevMap[o.id] = orderStatus(o); });

  let newlyReady = null;
  let newlyRejected = null;
  myOrdersAll.forEach(o => {
    const prevStatus = prevMap[o.id];
    if(orderStatus(o) === 'siap' && prevStatus !== 'siap' && prevStatus !== 'selesai' && prevStatus !== undefined){
      newlyReady = o;
    }
    if(orderStatus(o) === 'rejected' && prevStatus !== orderStatus(o) && prevStatus !== undefined){
      newlyRejected = o;
    }
  });

  // Orders that are 'selesai' are fully done - save a receipt snapshot
  // (if not already saved) and drop them from tracking so the queue
  // button/page stops showing them.
  const myOrders = myOrdersAll.filter(o => orderStatus(o) !== 'selesai');
  const justDone = myOrdersAll.filter(o => orderStatus(o) === 'selesai');
  const removedIds = justDone.map(o => o.id);

  if(justDone.length > 0){
    if(!state.myReceipts) state.myReceipts = [];
    const existingIds = new Set(state.myReceipts.map(r => r.id));
    justDone.forEach(o => {
      if(!existingIds.has(o.id)) state.myReceipts.unshift(o);
    });
    state.completedOrder = justDone[0];
    // Loyalty is credited when the order completes, so fetch the new total.
    if(!state.myLoyaltyLoading) state.myLoyalty = undefined;
    if(completedReturnTimer) clearTimeout(completedReturnTimer);
    const completedId = state.completedOrder.id;
    completedReturnTimer = setTimeout(() => {
      if(state.completedOrder && state.completedOrder.id === completedId){
        state.completedOrder = null;
        if(state.view === 'waiting'){
          const nextOrder = (state.myOrders || [])[0];
          if(nextOrder){ state.activeQueueId = nextOrder.id; state.view = 'waiting'; }
          else state.view = 'menu';
        }
        completedReturnTimer = null;
        render();
      }
    }, 8000);
  }

  if(removedIds.length > 0){
    state.myOrderIds = state.myOrderIds.filter(id => !removedIds.includes(id));
    if(removedIds.includes(state.activeQueueId)){
      const nextOrder = myOrders[0];
      state.activeQueueId = nextOrder ? nextOrder.id : null;
    }
  }

  const changed = JSON.stringify(myOrders) !== JSON.stringify(state.myOrders) || removedIds.length > 0;
  state.myOrders = myOrders;
  const rejectedOrders = myOrders.filter(isOrderRejected);
  if(rejectedOrders.length > 0){
    if(!state.myReceipts) state.myReceipts = [];
    const receiptIds = new Set(state.myReceipts.map(r => r.id));
    rejectedOrders.forEach(o => {
      if(!receiptIds.has(o.id)) state.myReceipts.unshift(o);
      scheduleRejectedOrderDismissal(o.id);
    });
    persistAppSession();
  }

  if(newlyReady){
    notifyOrderReady(newlyReady);
    if(CUSTOMER_AUTO_JUMP_VIEWS.includes(state.view) && !state.lightboxImage){
      state.activeQueueId = newlyReady.id;
      state.view = 'waiting';
    }
  }
  if(newlyRejected){
    notifyOrderRejected(newlyRejected);
    if(CUSTOMER_AUTO_JUMP_VIEWS.includes(state.view) && !state.lightboxImage){
      state.activeQueueId = newlyRejected.id;
      state.view = 'waiting';
    }
  }

  return { changed, newlyReady, newlyRejected };
}

/* ---------- polling ---------- */
// Pause between the end of one poll and the start of the next. Apps Script
// takes 1.5-3s per request, so a fixed 3s interval often skipped a beat and
// left 6s gaps; chaining keeps status changes arriving every ~3s.
const POLL_GAP_MS = 1000;
let pollGeneration = 0;
let pollingStarted = false;
let pollNow = null; // set by setupPolling: run a poll immediately
// render() calls this on every redraw. The loops and the storage listener must
// only be created once: re-creating them on each render leaked a listener per
// redraw (the admin tablet slowed down over a day) and kept restarting timers.
function setupPolling(){
  if(pollingStarted) return;
  pollingStarted = true;
  if(pollTimer) clearTimeout(pollTimer);
  const generation = ++pollGeneration; // stops any loop from an earlier call
  let lastAdminSessionCheck = 0;
  const scheduleNext = () => { if(generation === pollGeneration) pollTimer = setTimeout(pollOnce, POLL_GAP_MS); };
  let pollRunning = false;
  pollNow = () => { if(!pollRunning){ clearTimeout(pollTimer); pollOnce(); } };
  const pollOnce = async ()=>{
    if(generation !== pollGeneration || pollRunning) return;
    pollRunning = true;
    // Admin keeps polling in a background tab (e.g. while WhatsApp is open)
    // so the new-order alarm still rings; customers pause to save requests.
    if(document.hidden && state.view !== 'admin'){ pollRunning = false; pollTimer = setTimeout(pollOnce, 3000); return; }
    try{
    checkMidnightReset(); // check auto reset on 1st of month
    if(state.view === 'admin'){
      if(Date.now() - lastAdminSessionCheck > 30000){
        lastAdminSessionCheck = Date.now();
        // Checked alongside the orders request instead of before it.
        adminSessionIsValid().then(sessionValid => {
          if(sessionValid === true) adminInvalidSessionChecks = 0;
          if(sessionValid === false) adminInvalidSessionChecks += 1;
          if(adminInvalidSessionChecks >= 3){ forceAdminLogout('Sesi admin telah tamat. Sila log masuk semula.'); adminInvalidSessionChecks=0; }
        }).catch(()=>{});
      }
      const orders = applyPendingOrderStatuses(await loadOrders());
      if(state.view !== 'admin') return;
      // Keep "Memuat pesanan..." until the server has answered at least once.
      if(lastOrdersCache === null) return;
      const changed = JSON.stringify(orders) !== JSON.stringify(state.allOrders);
      if(changed) logOrderChanges(state.allOrders, orders);
      state.allOrders = orders;
      updateOrderAlarm(); // also covers tabs that skip re-rendering (Menu)
      const today = new Date().toDateString();
      const dateChanged = state.lastDashboardDate !== undefined && state.lastDashboardDate !== today;
      state.lastDashboardDate = today;
      if((changed || dateChanged) && (state.adminTab || 'pesanan') !== 'menu') render();
    } else {
      const { changed, newlyReady, newlyRejected } = await refreshMyOrders();
      if(changed || newlyReady || newlyRejected) render();
    }
    }finally{ pollRunning = false; scheduleNext(); }
  };
  pollTimer = setTimeout(pollOnce, POLL_GAP_MS);

  // Also poll menu meta, but slower to avoid repeated network permission popups in Preview
  if(menuMetaTimer) clearInterval(menuMetaTimer);
  let menuMetaInFlight = false;
  menuMetaTimer = setInterval(async () => {
    if(menuMetaInFlight || document.hidden) return;
    menuMetaInFlight = true;
    try{ await loadMenuMeta(); }
    finally{ menuMetaInFlight = false; }
  }, 30000);

  // Listen for localStorage changes from OTHER tabs (admin tab saves -> customer tab updates)
  window.addEventListener('storage', (e) => {
    if(e.key === 'kfedeSolOrderStatusSync'){
      try{
        const change = JSON.parse(e.newValue || '{}');
        let changed = false;
        (state.myOrders || []).forEach(order => {
          if(String(order.id) === String(change.id) && order.status !== change.status){
            order.status = change.status;
            changed = true;
          }
        });
        if(changed && state.view === 'waiting') render();
      }catch(err){}
      return;
    }
    if(e.key === 'kfedeSolMenuPublished'){
      try{
        const publishedMap = JSON.parse(e.newValue || '{}');
        let changed = false;
        Object.keys(publishedMap).forEach(id => {
          const published = publishedMap[id] !== false;
          if(menuPublished[id] !== published){
            menuPublished[id] = published;
            if(!published && state.cart[id]) state.cart[id] = 0;
            changed = true;
          }
        });
        if(changed && (state.view === 'menu' || state.view === 'preview')) render();
      }catch(err){}
      return;
    }
    if(e.key !== 'kfedeSolMenuOverrides') return;
    try{
      const overrides = JSON.parse(e.newValue || '{}');
      let changed = false;
      Object.keys(overrides).forEach(id => {
        const ov = overrides[id];
        if(ov.name && menuNames[id] !== ov.name){ menuNames[id] = ov.name; changed = true; }
        if(ov.price != null && menuPrices[id] !== ov.price){ menuPrices[id] = ov.price; changed = true; }
        const mi = MENU.find(m => m.id === id);
        if(mi){
          if(ov.name) mi.name = ov.name;
          if(ov.price != null) mi.price = ov.price;
        }
      });
      if(changed && (state.view === 'menu' || state.view === 'preview')) render();
    }catch(err){}
  });
}

/* ---------- catch-up check when returning to the app ---------- */
let visibilityListenerAttached = false;
let menuMetaTimer = null;
function setupVisibilityCatchup(){
  if(visibilityListenerAttached) return;
  visibilityListenerAttached = true;
  document.addEventListener('visibilitychange', async () => {
    updateWakeLock(); // the browser drops the wake lock whenever the page hides
    if(document.visibilityState !== 'visible') return;
    if(state.view === 'admin'){
      // Back from another app or from sleep: check for orders now, not on the
      // next (throttled) timer tick, so the alarm rings straight away.
      if(pollNow) pollNow();
      return;
    }
    const { changed, newlyReady, newlyRejected } = await refreshMyOrders();
    if(changed || newlyReady || newlyRejected) render();
  });
}


// A tap anywhere outside the activity panel closes it (the bell and the panel
// stop their own clicks from reaching here).
document.addEventListener('click', () => {
  if(state.activityOpen && state.view === 'admin'){ state.activityOpen = false; render(); }
});

/* ---------- Admin: Back button guard ----------
   On the tablet the Back button used to close the app, and the next launch
   looked like a logout. While the admin panel is open, Back now only closes
   whatever is open (menu drawer, log, pop-up) or shows a hint. Leaving admin
   is done with Log Keluar. */
var adminBackGuardArmed = false;
function armAdminBackGuard(){
  if(state.view === 'admin' && !adminBackGuardArmed){
    adminBackGuardArmed = true;
    try{ history.pushState({ kfeAdmin:true }, ''); }catch(e){}
  } else if(state.view !== 'admin'){
    adminBackGuardArmed = false;
  }
}
window.addEventListener('popstate', () => {
  if(state.view !== 'admin') return;
  try{ history.pushState({ kfeAdmin:true }, ''); }catch(e){}
  const dialog = document.querySelector('.confirm-overlay .confirm-cancel');
  if(dialog){ dialog.click(); return; }
  if(state.activityOpen || state.adminNavOpen || state.zoomChart || state.receiptModalOrderId){
    state.activityOpen = false; state.adminNavOpen = false; state.zoomChart = null; state.receiptModalOrderId = null;
    render();
    return;
  }
  showToast('Untuk keluar dari admin, tekan "Log Keluar".', 'error');
});

/* ---------- Admin: keep the screen awake ----------
   A sleeping tablet stops the page, so new orders arrive silently. The Screen
   Wake Lock keeps the display on while the admin panel is visible. It cannot
   help once another app is in front; the browser releases it then. */
var wakeLockSentinel = null;
var wakeLockBusy = false;
function wakeLockWanted(){
  try{ return localStorage.getItem('kfedeSolWakeLock') !== '0'; }catch(e){ return true; }
}
async function updateWakeLock(){
  if(!('wakeLock' in navigator) || wakeLockBusy) return;
  const want = state.view === 'admin' && !!state.loggedInAdmin && wakeLockWanted() && document.visibilityState === 'visible';
  wakeLockBusy = true;
  try{
    if(want && !wakeLockSentinel){
      wakeLockSentinel = await navigator.wakeLock.request('screen');
      wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
    } else if(!want && wakeLockSentinel){
      await wakeLockSentinel.release();
      wakeLockSentinel = null;
    }
  }catch(e){ wakeLockSentinel = null; }
  finally{ wakeLockBusy = false; }
}

/* Tap that still works when the on-screen keyboard is open. On a tablet, the
   first touch on a button closes the keyboard and shifts the page, so the
   browser never sends "click" and the button looked dead. touchend is always
   delivered to the element the finger started on. */
function bindTap(el, handler){
  let lastRun = 0, startX = 0, startY = 0;
  const run = e => {
    if(e) e.preventDefault();
    if(Date.now() - lastRun < 600) return; // touchend is followed by a click
    lastRun = Date.now();
    handler();
  };
  el.addEventListener('touchstart', e => { const t = e.touches[0]; startX = t.clientX; startY = t.clientY; }, {passive:true});
  el.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    if(Math.abs(t.clientX - startX) > 12 || Math.abs(t.clientY - startY) > 12) return; // it was a scroll
    run(e);
  });
  el.onclick = run;
}

/* ---------- Confirm dialog (animated, replaces window.confirm) ----------
   Resolves true only when "Ya" is pressed. "Tidak" has focus, and Escape or a
   tap outside the box cancels, so a slip of the finger never confirms. */
function confirmDialog({ title, message, confirmText, cancelText, danger }){
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.setAttribute('role', 'alertdialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.innerHTML = `
      <div class="confirm-box ${danger ? 'danger' : ''}">
        <div class="confirm-icon" aria-hidden="true">${danger ? '!' : '?'}</div>
        <h3 class="confirm-title">${escapeHtml(title || 'Anda pasti?')}</h3>
        <p class="confirm-message">${escapeHtml(message || '')}</p>
        <div class="confirm-actions">
          <button type="button" class="confirm-cancel">${escapeHtml(cancelText || 'Tidak')}</button>
          <button type="button" class="confirm-ok">${escapeHtml(confirmText || 'Ya')}</button>
        </div>
      </div>`;
    const close = answer => {
      document.removeEventListener('keydown', onKey);
      overlay.classList.add('closing');
      setTimeout(() => overlay.remove(), 180);
      resolve(answer);
    };
    const onKey = e => { if(e.key === 'Escape') close(false); };
    overlay.querySelector('.confirm-cancel').onclick = () => close(false);
    overlay.querySelector('.confirm-ok').onclick = () => close(true);
    overlay.onclick = e => { if(e.target === overlay) close(false); };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    overlay.querySelector('.confirm-cancel').focus();
  });
}

/* ---------- Toast notification helper ---------- */
function showToast(msg, type){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const toast = document.createElement('div');
  toast.className = 'toast' + (type ? ' ' + type : '');
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { if(toast.parentNode) toast.parentNode.removeChild(toast); }, 2600);
}


/* ---------- Midnight auto-reset on 1st of month ---------- */
let lastAutoResetCheck = null;
async function checkMidnightReset(){
  const now = new Date();
  const key = now.getFullYear() + '-' + (now.getMonth()+1) + '-' + now.getDate();
  if(lastAutoResetCheck === key) return; // already checked today
  lastAutoResetCheck = key;

  // Only reset on 1st of month, between 00:00 and 00:05
  const isFirstOfMonth = now.getDate() === 1;
  const isJustAfterMidnight = now.getHours() === 0 && now.getMinutes() <= 5;
  if(isFirstOfMonth && isJustAfterMidnight){
    // Archive customers first (keeps monthly data)
    await archiveCustomersIfNeeded();
    // Reset active orders only
    await resetAllOrders();
    if(state.view === 'admin'){
      state.allOrders = [];
      showToast('🌙 Auto-reset: Pesanan bulan lama telah dikosongkan. Data laporan disimpan.', 'success');
      render();
    }
  }
}

  }

// Opening/closing time passes while the app is open, and admins may add a
// holiday or extra hours at any time: re-check the clock every 30s and the
// server schedule every minute. Admin screens are not re-rendered here so
// forms being typed into are left alone.
let shopStatusInFlight = false;
let lastShopStatusLoad = Date.now();
setInterval(async ()=>{
  if(document.hidden || shopStatusInFlight) return;
  // Only re-render when open/closed actually flips, not when the lists change,
  // so a customer typing on the register screen is not interrupted.
  const openKey = () => [state.shopClosed, state.shopClosedUntil, state.shopOutsideHours, JSON.stringify(state.shopHours)].join('|');
  const before = openKey();
  refreshShopOpenState();
  if(Date.now() - lastShopStatusLoad >= 60000){
    shopStatusInFlight = true;
    lastShopStatusLoad = Date.now();
    try{ await loadShopStatus(); }
    catch(e){}
    finally{ shopStatusInFlight = false; }
  }
  if(before !== openKey() && state.view !== 'admin' && state.view !== 'admin-login') render();
}, 30000);
